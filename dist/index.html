<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NWKS Encounter — Men's & Women's Retreats</title>
<meta name="description" content="Northwest Kansas Encounter — Men's Encounter (Aug 6–8, 2026) and Women's Encounter (July 17–19, 2026). It is for freedom that Christ has set us free. Galatians 5:1.">
<meta name="theme-color" content="#6E765F" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#3D4127" media="(prefers-color-scheme: dark)">
<style>
:root{
  /* shared neutral frame — light warm stone + antique gold */
  --f-bg:#EAE3D4; --f-bg2:#E2DAC8; --f-ink:#2A2723; --f-gold:#9C8038; --f-rule:#cdbf9d;
  /* men signature */
  --m-olive:#3D4127; --m-olive-deep:#2A2D1B; --m-gun:#1B1D17; --m-yellow:#E6C12F;
  --m-bone:#E8E3D2; --m-dim:#b3ae99;
  /* women signature */
  --w-pearl:#FAF6F1; --w-pearl-deep:#EFE7DC; --w-ink:#2A2622; --w-gold:#B5984F; --w-gold-deep:#8c722f; --w-dim:#6b6358;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
}

</style>
<style>
/* fonts.css — owned by worlds-coder (Women's Encounter restyle, Phase 2).
   PRETTIER type system for the Women's world ONLY — elegant, distinct from the Men's
   all-serif Iowan Old Style. Self-contained: NO CDN / Google Fonts / runtime network
   font requests (90% of visitors are iPhone/Safari, so this must never depend on a fetch).

   Chosen: Apple-first system stack (zero weight, zero bytes, instant paint).
   'Bodoni 72' and 'Avenir Next' both ship natively on iOS + macOS (Safari resolves them
   with no download), so this is effectively free while still reading as a deliberate,
   editorial pairing rather than the default UI font:
     display (headings/tagline) -> 'Bodoni 72','Didot','Hoefler Text',Georgia,serif
     body / UI (paragraphs, nav, buttons, contacts) -> 'Avenir Next','Avenir',
       -apple-system,system-ui,sans-serif
   Fallback chain still resolves to a normal serif/sans everywhere else (Georgia / system-ui),
   so non-Apple browsers never break — they just don't get the exact display face.

   NOTE: this file is now linked from src/index.html after tokens.css and before worlds.css.
   These custom properties (--w2-font-display / --w2-font-body) are also duplicated locally
   inside the .world--women rule in worlds.css so the
   Women's world already renders correctly today without this file being wired in. Once wired,
   worlds.css can drop its local duplicate and reference these instead.

   If a small embedded display serif is ever wanted instead of the Apple-first stack, add a
   single @font-face here (base64 woff2, open-license, keep it small — a few dozen KB) scoped
   only to --w2-font-display, and only for Women's headings. Not done here: the Apple-first
   stack already delivers a genuinely different, elegant look at zero cost. */

:root{
  --w2-font-display:'Bodoni 72','Didot','Hoefler Text',Georgia,serif;
  --w2-font-body:'Avenir Next','Avenir',-apple-system,system-ui,sans-serif;
}

</style>
<style>
*{box-sizing:border-box;margin:0;padding:0}
/* iOS Safari samples the BODY background-color to tint its translucent top/bottom
   chrome (and viewport-fit=cover fills the notch/home-indicator gutters with it).
   The gateway is olive on top (Men's) and pearl on the bottom (Women's), so the body
   is a hard 50/50 split: Safari samples olive at the top edge -> green top chrome, and
   pearl at the bottom edge -> white bottom chrome. Never #000 (that painted black bars).
   Worlds override this to a solid color via body[data-view] below. */
/* Body background-color is olive -> Safari tints the TOP chrome green (Men's, top half).
   iOS Safari samples a SOLID background-color (it ignores gradients), so for the WHITE
   bottom chrome (Women's, bottom half) we pin a solid pearl strip to the bottom edge via
   ::after — Safari samples it for the bottom toolbar. It sits over the gateway's pearl
   bottom half, so it's invisible there. Hidden once a world is open (body[data-view]),
   where a single solid body color drives both bars. */
html{height:100%;background:#FAF6F1}
body{height:100%;font-family:"Helvetica Neue",Arial,system-ui,sans-serif;color:#fff;
  overflow:hidden;-webkit-font-smoothing:antialiased;background:#FAF6F1}
body[data-view="men"]{background:#6E765F}
body[data-view="women"]{background:#FAF6F1}
/* World pages (own URL ?door=): hide the gateway and paint the whole screen the world's
   color from the FIRST paint, so iOS Safari samples the correct chrome tint on load. */
html[data-world] .half,html[data-world] .frame,html[data-world] .concept-switcher{display:none!important}
html[data-world="men"],html[data-world="men"] body{background:#6E765F}
html[data-world="women"],html[data-world="women"] body{background:#FAF6F1}
/* position:fixed + inset:0 makes the stage fill the ENTIRE physical screen — including
   under the status bar and home indicator — so the men's/women's halves paint edge to
   edge and iOS Safari tints its chrome from the real page content, not the body. */
.stage{position:fixed;inset:0;display:flex;width:100%;overflow:hidden}

/* Screen-reader-only: keeps a real heading in the a11y tree without showing it. */
.visually-hidden{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;
  overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;border:0}

/* ---------- UNIFORM HALF ---------- */
.half{position:relative;flex:1 1 0;min-width:0;overflow:hidden;display:flex;flex-direction:column;
  align-items:center;justify-content:center;cursor:default}
/* No hover flex animation — the two doors are static 50/50. The mouse-over resize
   was fussy and caused the hover-steal jerk at the start of a transition. */
.half__inner{position:relative;z-index:3;width:100%;display:flex;flex-direction:column;align-items:center;
  text-align:center;padding:calc(clamp(46px,6.5vh,62px) + 4vh) 7vw calc(78px + 4vh);
  transform:none;opacity:1}
.eyebrow{font-size:clamp(.62rem,1.05vw,.82rem);letter-spacing:.4em;text-transform:uppercase;
  font-weight:700;margin-bottom:2.4vh}
.mark{width:clamp(200px,25vw,330px);max-width:72vw;animation:float 7s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.rule{width:clamp(110px,15vw,190px);height:2px;margin:2vh auto 0}
.dates{font-size:clamp(.78rem,1.3vw,1rem);letter-spacing:.14em;text-transform:uppercase;margin-top:1.3em}
.enter{margin-top:3vh;display:inline-flex;align-items:center;gap:.7em;font-size:.72rem;
  letter-spacing:.32em;text-transform:uppercase;font-weight:700;padding:.95em 1.9em;border:1px solid;
  background:transparent;cursor:pointer;transition:all .35s ease;border-radius:2px}
.enter .arr{transition:transform .35s ease}
.enter:hover .arr{transform:translateX(6px)}
.enter:focus-visible{outline:3px solid var(--f-gold);outline-offset:3px}

/* ---------- MEN signature ---------- */
/* Flat #6E765F = the exact background color of the men's logo JPG, so the logo's
   own background blends into the panel with no visible edge. Texture layer removed
   on purpose — any texture behind the logo would re-expose its square boundary. */
.half--men{color:var(--m-bone);background:#6E765F}
.half--men::before{display:none}
.half--men::after{display:none}
@keyframes drift{from{transform:translate3d(0,0,0)}to{transform:translate3d(-4%,-3%,0)}}
/* Men's mark is a tight circular badge; sized up so it reads as visually equal in mass
   to the women's wider horizontal wordmark on the gateway. */
.half--men .mark{filter:none}
.half--men .eyebrow{color:var(--m-yellow)}
.half--men .dates{color:#FAF8F0}
.half--men .enter:focus-visible{outline-color:var(--m-yellow)}
.half--men .rule{background:var(--m-yellow);box-shadow:0 1px 0 rgba(0,0,0,.4)}
.half--men .enter{border-color:var(--m-bone);color:var(--m-bone)}
.half--men .enter:hover{background:var(--m-yellow);border-color:var(--m-yellow);color:var(--m-gun)}

/* ---------- WOMEN signature ---------- */
.half--women{color:var(--w-ink);background:
  linear-gradient(180deg,#FFFFFF 0%,#FAF6F1 100%)}
.half--women::before{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background-image:
  radial-gradient(2px 2px at 25% 40%,rgba(181,152,79,.5),transparent),
  radial-gradient(1.5px 1.5px at 65% 22%,rgba(181,152,79,.4),transparent),
  radial-gradient(2px 2px at 80% 70%,rgba(200,166,162,.5),transparent),
  radial-gradient(1.5px 1.5px at 40% 82%,rgba(181,152,79,.35),transparent);
  animation:motes 18s ease-in-out infinite alternate}
@keyframes motes{from{transform:translateY(0);opacity:.7}to{transform:translateY(-16px);opacity:1}}
.half--women .mark{filter:drop-shadow(0 12px 26px rgba(42,38,34,.14))}
.half--women .eyebrow{color:var(--w-gold-deep)}
.half--women .dates{color:var(--w-dim)}
.half--women .rule{background:var(--w-gold)}
.half--women .enter{border-color:var(--w-gold);color:var(--w-gold-deep)}
.half--women .enter:hover{background:var(--w-gold);border-color:var(--w-gold);color:#fff;letter-spacing:.38em}

/* ---------- SHARED LIGHT FRAME ---------- */
/* Gateway top/bottom bars removed per operator — the two doors now run full-height. */
.frame{display:none !important}
.frame-top{top:0;height:clamp(46px,6.5vh,62px);border-bottom:1px solid var(--f-rule);
  box-shadow:0 1px 0 rgba(255,255,255,.4) inset;animation:fadeIn 1s ease 3s forwards}
.frame-top .nm{font-family:var(--serif);font-weight:600;letter-spacing:.34em;
  font-size:clamp(.74rem,1.3vw,.98rem);text-transform:uppercase;
  display:inline-flex;align-items:center;gap:.8em}
.frame-top .dot{width:5px;height:5px;background:var(--f-gold);transform:rotate(45deg);display:inline-block}
.frame-bottom{bottom:0;flex-direction:column;padding:.85em 1em;border-top:1px solid var(--f-rule);
  animation:fadeIn 1s ease 3.2s forwards}
.frame-bottom .vs{font-family:var(--serif);font-style:italic;
  font-size:clamp(.84rem,1.5vw,1.08rem);letter-spacing:.01em}
.frame-bottom .ref{font-weight:700;letter-spacing:.34em;font-size:clamp(.56rem,.95vw,.68rem);
  text-transform:uppercase;margin-top:.5em;color:var(--f-gold)}

/* ---------- INTRO ---------- */
.intro{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;
  justify-content:center;text-align:center;background:radial-gradient(120% 100% at 50% 40%,#2c2a20,#13120d 82%);
  animation:introOut .9s ease 2.2s forwards}
.intro h1{font-family:var(--serif);color:var(--m-bone);font-weight:600;letter-spacing:.34em;
  text-transform:uppercase;font-size:clamp(1.4rem,4.2vw,2.7rem);opacity:0;animation:up .9s ease .25s forwards}
.intro .sub{color:var(--f-gold);font-style:italic;margin-top:1.1em;letter-spacing:.04em;
  font-family:var(--serif);font-size:clamp(.9rem,1.9vw,1.2rem);opacity:0;animation:up .9s ease .65s forwards}
.intro .ln{width:0;height:1px;background:linear-gradient(90deg,transparent,var(--f-gold),transparent);
  margin:1.6em auto 0;animation:lnw 1s ease 1s forwards}
@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes lnw{to{width:min(260px,60vw)}}
@keyframes introOut{to{opacity:0;visibility:hidden;transform:scale(1.06)}}

/* ---------- ENTRANCE ---------- */
@keyframes reveal{to{opacity:1;transform:translateY(0)}}
@keyframes grow{to{width:clamp(110px,15vw,190px)}}
@keyframes fadeIn{to{opacity:1}}

/* ---------- ENTER PREVIEW (legacy toast, harmless if unused) ---------- */
.half.entering{flex-grow:6 !important;filter:none !important}
.stage.has-entering .half:not(.entering){flex-grow:.001 !important;filter:saturate(.4) brightness(.6) !important}
.toast{position:absolute;left:50%;bottom:15vh;z-index:40;transform:translate(-50%,20px);
  background:rgba(0,0,0,.84);color:#fff;padding:.8em 1.4em;border-radius:4px;font-size:.8rem;
  letter-spacing:.03em;opacity:0;pointer-events:none;transition:.4s;max-width:80vw}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- WORLDS (hidden gateway when a world is open) ---------- */
.stage.world-open .half,.stage.world-open .frame{display:none}
.world{position:relative;width:100%;min-height:100vh;min-height:100svh;min-height:100dvh;overflow-y:auto}
.world[hidden]{display:none}

/* ---------- CONCEPT SWITCHER (operator control, tasteful + out of the way) ---------- */
/* Lets the operator pick which registered transition concept plays per door
   before hitting Enter. Options are populated live by app.js from whatever's
   registered in NWKS.transitions. data-hook="concept-switcher" on the panel
   makes it trivial to hide later (display:none[data-hook="concept-switcher"]). */
.concept-switcher{position:absolute;left:1.1em;bottom:1.1em;z-index:20;
  display:flex;flex-direction:column;gap:.5em;padding:.7em .85em;
  background:rgba(15,14,11,.66);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.14);
  border-radius:6px;opacity:0;animation:fadeIn 1s ease 3.4s forwards}
.concept-switcher[hidden]{display:none}
.stage.world-open .concept-switcher{display:none}
/* Only one approved concept per door right now — hide the switcher until there
   are multiple good ones to choose between. Remove this line to bring it back. */
.concept-switcher{display:none}
.concept-switcher__row{display:flex;align-items:center;gap:.6em}
.concept-switcher__label{font-size:.6rem;letter-spacing:.16em;text-transform:uppercase;
  font-weight:700;color:var(--m-dim);width:5.4em;flex:0 0 auto}
.concept-switcher__select{font-family:"Helvetica Neue",Arial,system-ui,sans-serif;
  font-size:.68rem;letter-spacing:.03em;color:#fff;background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.22);border-radius:3px;padding:.35em .5em;
  cursor:pointer;max-width:11.5em}
.concept-switcher__select:focus{outline:2px solid var(--f-gold);outline-offset:1px}
@media(max-width:760px){
  .concept-switcher{left:.6em;bottom:.6em;right:.6em}
}
@media(prefers-reduced-motion:reduce){
  .concept-switcher{opacity:1;animation:none}
}

/* ---------- MOBILE ---------- */
.scrollhint{display:none;position:absolute;left:50%;bottom:calc(78px + 2vh);transform:translateX(-50%);
  z-index:7;flex-direction:column;align-items:center;gap:.4em;color:var(--m-bone);opacity:.85;
  font-size:.6rem;letter-spacing:.28em;text-transform:uppercase;animation:bob 1.8s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,6px)}}
@media(max-width:760px){
  /* Vertical 50/50 split — both doors visible on one screen, stacked top/bottom. */
  .stage{flex-direction:column}
  /* Symmetric padding on BOTH halves so the two mirror EXACTLY (men clears the status bar,
     women clears the toolbar/home indicator; the redundant inset on each sits at the split
     and is harmless). Both halves are 50/50 and now center content identically. */
  .half{min-height:0;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
  .half__inner{padding:2vh 8vw}
  /* Both logo files are now padding-free (men's trimmed to 336x335), so equal element size
     = equal visible size AND equal element height -> uniform spacing. */
  .half--men .mark,.half--women .mark{width:clamp(120px,36vw,168px);animation:none}
  /* More breathing room around the logo (operator): title->logo and logo->rule. */
  .eyebrow{margin-bottom:2.7vh}
  .rule{margin-top:2.7vh}
  .enter{margin-top:2.2vh;min-height:44px;padding:.95em 2.2em}
  /* No animated sparkles / floating on mobile (operator: remove the little animations). */
  .half--women::before{display:none}
}
/* Short viewports (SE-class / landscape): never trap the sole ENTER below the fold. */
@media(max-height:620px){
  body{overflow-y:auto}
  .stage{height:auto;min-height:100dvh}
}
@media(prefers-reduced-motion:reduce){
  *{animation:none !important;transition:none !important}
  .half__inner{opacity:1;transform:none}.intro{display:none}
  .frame{opacity:1}.rule{width:clamp(110px,15vw,190px)}
}

</style>
<style>
/* worlds.css — owned by worlds-coder.
   Styles for #world-men / #world-women content built by src/js/worlds.js
   from src/content/*.js. Shares tokens.css (--f-*, --m-*, --w-*, --serif).
   Themes: Men's = olive/gunmetal + yellow FREEDOM accent (rugged hero, calm readable body).
           Women's = white + light baby pink + black, elegant + distinct type system
           (--w2-* tokens scoped below; see src/styles/fonts.css for the type-system source). */

.world{background:var(--f-bg);color:var(--f-ink);font-family:var(--serif);
  position:relative;isolation:isolate}

/* ---------- AMBIENT BACKGROUND (Task 1) ----------
   One <canvas> per door (men/women), created by src/js/worlds.js startAmbient() and
   inserted as the world's first child. position:fixed keeps it pinned to the viewport;
   z-index:-1 places it inside the .world stacking context (established by
   isolation:isolate above) UNDER all normal-flow content but ABOVE the flat world
   background — see the paint-order note in worlds.js. Never intercepts input. */
.world-ambient{position:fixed;inset:0;width:100%;height:100%;z-index:-1;
  pointer-events:none;display:block}
@media(prefers-reduced-motion:reduce){
  .world-ambient{opacity:.7}
}

/* ---------- STICKY HEADER ---------- */
.world-header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:1em;
  padding:.85em 4vw;background:rgba(234,227,212,.92);backdrop-filter:blur(6px);
  border-bottom:1px solid var(--f-rule);
  padding-top:max(.85em, env(safe-area-inset-top));
  padding-left:max(4vw, env(safe-area-inset-left));
  padding-right:max(4vw, env(safe-area-inset-right))}
.world-back{font-family:"Helvetica Neue",Arial,system-ui,sans-serif;font-weight:700;
  letter-spacing:.14em;font-size:.7rem;text-transform:uppercase;color:var(--f-ink);
  background:transparent;border:1px solid var(--f-rule);border-radius:2px;padding:.55em 1em;
  cursor:pointer;transition:.25s;flex:0 0 auto}
.world-back:hover{background:var(--f-gold);border-color:var(--f-gold);color:#fff}
.world-header__name{font-weight:600;letter-spacing:.08em;font-size:clamp(.82rem,1.6vw,1rem);
  text-transform:uppercase;flex:1 1 auto;text-align:right}

/* ---------- HERO ---------- */
.world-hero{display:flex;flex-direction:column;align-items:center;text-align:center;
  padding:6vh 6vw 5vh}
.world-hero__logo{width:clamp(150px,30vw,230px);aspect-ratio:1/1;border-radius:50%;
  background-size:cover;background-position:center;background-repeat:no-repeat;

.world-hero__title{font-size:clamp(1.5rem,4.4vw,2.5rem);font-weight:600;letter-spacing:.02em}
.world-hero__tagline{font-style:italic;margin-top:.6em;color:var(--f-gold);
  font-size:clamp(.9rem,1.8vw,1.05rem)}
.world-hero__dates{margin-top:1em;letter-spacing:.18em;text-transform:uppercase;
  font-family:"Helvetica Neue",Arial,system-ui,sans-serif;font-size:clamp(.72rem,1.3vw,.86rem)}
.world-cta{display:inline-flex;align-items:center;margin-top:2em;padding:1em 2.2em;
  font-family:"Helvetica Neue",Arial,system-ui,sans-serif;font-weight:700;letter-spacing:.24em;
  text-transform:uppercase;font-size:.72rem;border-radius:2px;text-decoration:none;
  border:1px solid var(--f-gold);color:var(--f-gold);background:transparent;cursor:pointer;
  transition:.3s}
.world-cta:hover{background:var(--f-gold);color:#fff}

/* ---------- HERO CTA GROUP (Task 2: uniform Attendee + Server registration) ----------
   Two buttons side by side on desktop, stacked full-width on mobile (see @media below).
   The Server button reuses .world-cta's themed colors but with a dashed border so it
   reads as the secondary action next to the solid Attendee CTA. */
.world-hero__cta-group{display:flex;flex-wrap:wrap;justify-content:center;gap:1em;margin-top:2em}
.world-hero__cta-group .world-cta{margin-top:0}
.world-cta--secondary{border-style:dashed}

/* ---------- BODY ---------- */
.world-body{max-width:1000px;margin:0 auto;padding:0 6vw}
.world-section{padding:3.4vh 0;border-top:1px solid var(--f-rule)}
.world-section:first-child{border-top:none}
.world-section__title{font-size:clamp(1.05rem,2.4vw,1.3rem);font-weight:600;letter-spacing:.02em;
  margin-bottom:.85em}
.world-p{line-height:1.7;font-size:clamp(.92rem,1.6vw,1rem);margin-bottom:.9em}
.world-p:last-child{margin-bottom:0}
.world-p--link{margin-top:1.1em}
.world-inline-link{color:var(--f-gold);font-weight:600;text-decoration:none;border-bottom:1px solid var(--f-gold)}
.world-inline-link:hover{opacity:.75}

.world-list{list-style:none;margin:0;padding:0}
.world-list li{position:relative;padding-left:1.5em;line-height:1.6;margin-bottom:.55em;
  font-size:clamp(.9rem,1.5vw,.98rem)}
.world-list li::before{content:"";position:absolute;left:0;top:.5em;width:6px;height:6px;
  background:var(--f-gold);transform:rotate(45deg)}

.world-contacts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.7em}
.world-contact{display:flex;flex-wrap:wrap;align-items:baseline;gap:.6em 1em;
  padding:.6em 0;border-bottom:1px dashed var(--f-rule)}
.world-contact:last-child{border-bottom:none}
.world-contact__name{font-weight:600;flex:1 1 auto;min-width:9em}
.world-contact__link{font-family:"Helvetica Neue",Arial,system-ui,sans-serif;font-size:.85rem;
  color:var(--f-gold);text-decoration:none;border-bottom:1px solid transparent}
.world-contact__link:hover{border-bottom-color:var(--f-gold)}

.world-section--cost .world-p,.world-section--register{font-weight:500}

/* ---------- REGISTER (secondary block) ---------- */
.world-register{display:flex;flex-wrap:wrap;gap:.9em}
.world-register__btn{display:inline-flex;align-items:center;padding:.85em 1.6em;
  font-family:"Helvetica Neue",Arial,system-ui,sans-serif;font-weight:700;letter-spacing:.2em;
  text-transform:uppercase;font-size:.68rem;border-radius:2px;text-decoration:none;
  border:1px solid var(--f-rule);color:var(--f-ink);background:transparent;cursor:pointer;
  transition:.3s}
.world-register__btn:hover{background:var(--f-gold);border-color:var(--f-gold);color:#fff}

/* ---------- FULL-SCREEN REGISTER FORM PAGE ----------
   Built by src/js/worlds.js (buildFormPage) and mounted by NWKS.forms.render() (see
   src/js/forms.js). Plain show/hide (the [hidden] attribute) — NEVER history.pushState,
   app.js owns history/back for the gateway. Themed per-door below. */
.world-formpage{position:fixed;inset:0;z-index:20;background:var(--f-bg);color:var(--f-ink);
  display:flex;flex-direction:column;font-family:var(--serif)}
.world-formpage[hidden]{display:none}
.world-formpage__header{position:sticky;top:0;z-index:2;display:flex;align-items:center;
  flex:0 0 auto;padding:.85em 4vw;background:rgba(234,227,212,.92);backdrop-filter:blur(6px);
  border-bottom:1px solid var(--f-rule);
  padding-top:max(.85em, env(safe-area-inset-top));
  padding-left:max(4vw, env(safe-area-inset-left));
  padding-right:max(4vw, env(safe-area-inset-right))}
.world-formpage__back{font-family:"Helvetica Neue",Arial,system-ui,sans-serif;font-weight:700;
  letter-spacing:.14em;font-size:.7rem;text-transform:uppercase;color:var(--f-ink);
  background:transparent;border:1px solid var(--f-rule);border-radius:2px;padding:.55em 1em;
  cursor:pointer;transition:.25s}
.world-formpage__back:hover{background:var(--f-gold);border-color:var(--f-gold);color:#fff}
.world-formpage__scroll{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:5vh 6vw 8vh;
  padding-bottom:max(8vh, calc(env(safe-area-inset-bottom) + 3vh));
  padding-left:max(6vw, env(safe-area-inset-left));
  padding-right:max(6vw, env(safe-area-inset-right))}
.world-formpage__panel{max-width:640px;margin:0 auto}
.world-formpage__title{font-size:clamp(1.2rem,3vw,1.7rem);font-weight:600;letter-spacing:.02em;
  margin-bottom:1em}

.world--men .world-formpage{background:#6E765F;color:#FAF8F0}
.world--men .world-formpage__header{background:rgba(58,63,50,.96);border-bottom-color:rgba(230,193,47,.25)}
.world--men .world-formpage__back{color:#FAF8F0;border-color:var(--m-dim)}
.world--men .world-formpage__back:hover{background:var(--m-yellow);border-color:var(--m-yellow);color:var(--m-gun)}

.world--women .world-formpage{background:var(--w2-bg);color:var(--w2-ink)}
.world--women .world-formpage__header{background:rgba(255,255,255,.92);border-bottom-color:var(--w2-rule)}
.world--women .world-formpage__back{color:var(--w2-ink);border-color:var(--w2-pink-deep);
  font-family:var(--w2-font-body)}
.world--women .world-formpage__back:hover{background:var(--w2-pink-deep);border-color:var(--w2-pink-deep);color:#fff}

/* ================= RESEARCH NOTES (applied) =================
   - Single-column vertical flow, generous field rhythm, delicate top hairline
     divider between fields (fading gradient, not a hard rule) — feels premium
     without floating labels (rejected here: real spec labels are full
     sentences and would overlap/truncate as inset labels on a Google-Forms
     scale registration form).
   - Focus state = border-color shift + soft outer glow ring (box-shadow,
     color-mix with the theme accent) instead of a hard browser outline —
     the modern "glow" focus treatment from current form-UI writeups.
   - Choice rows (radio/checkbox) styled as bordered "cards": hover + a
     :has(:checked) highlighted state (background tint + accent border) so a
     selected option visually reads as chosen at a glance, not just a tiny dot.
   - Custom radio/checkbox rendered via appearance:none + background
     radial-gradient / inline SVG check — no extra DOM, still real native
     inputs (keyboard + a11y intact), :focus-visible ring added explicitly.
   - Submit button upgraded from an outline-then-fill link to a pill-shaped
     gradient CTA with a soft colored shadow and a hover lift — the "gorgeous
     submit button" ask; kept full-width + 52px tall on mobile per the
     existing 48px/16px mobile discipline.
   - Success/error status upgraded to a soft tinted card with a round icon
     badge instead of bare colored text — clearer at a glance, still uses
     role=status/aria-live wired in forms.js (untouched).
   - Women's specific: labels moved to the world's own display serif
     (Bodoni 72/Didot via --w2-font-display, already used for the tagline)
     in italic, with a small pink dot kicker — "pretty serif labels" — while
     inputs/options/buttons stay on the body sans (--w2-font-body) for
     legibility. Local --w-form-pink swatch removed in favor of the site's
     real --w2-pink-deep / --w2-rule tokens so the form now matches the rest
     of the Women's world instead of a slightly-off invented pink. */

<style>
/* transitions.css — shared by transition-core.js (harness) + transitions/*.js
   (concepts). Concepts add their own sections below the harness base; keep
   each concept's rules scoped to its own class prefix so they can't collide.
   Per-frame values (opacity, clip-path, transform) are set inline by the
   modules; this file owns layout, base visuals and the reduced-motion
   kill-switch. */

/* ---------- HARNESS: the cover layer (owned by transition-core.js) ---------- */
/* Every masked-swap transition runs inside one of these: fixed, full-viewport,
   above everything, invisible until a concept (or the harness's own safety
   net) makes it opaque. Concepts append their own child layers/canvases here
   and animate coverEl itself; nothing else in the DOM should ever need a
   transition-specific z-index. */
/* Cover layer must be VISIBLE by default so each concept's animated children
   (canvas, gradient veils, motes) actually render. Background stays transparent
   so concepts control what's seen; --opaque supplies the solid safety-fill that
   guarantees the DOM swap is hidden at the covered midpoint. */
.nwks-tx-cover{position:fixed;inset:0;z-index:999999;pointer-events:none;
  opacity:1;background:transparent}
.nwks-tx-cover--opaque{background:#0b0b09}
.nwks-tx-canvas{position:absolute;inset:0;width:100%;height:100%;display:block;
  pointer-events:none}
/* Nothing inside the cover ever captures pointer events — otherwise the cover
   canvas steals :hover from the gateway doors and the hovered (expanded) half
   snaps back to 50/50, producing a hard jerk at the start of the transition. */
.nwks-tx-cover, .nwks-tx-cover *{pointer-events:none !important}
/* While any transition is running, freeze the doors so their hover flex-grow
   animation can't jerk mid-transition — the field cross-fades over a still gateway. */
.stage.nwks-tx-active .half{transition:none !important}
.stage.nwks-tx-active:hover .half,
.stage.nwks-tx-active:hover .half:hover{flex-grow:1 !important;filter:none !important}

@media(prefers-reduced-motion:reduce){
  .nwks-tx-cover{display:none}
}

/* ---------- Men · Shatter (Canvas 2D shard field) ---------- */
/* No extra layout needed beyond .nwks-tx-canvas above — men-shatter.js draws
   everything (shards + crack flash) into one canvas sized to the viewport. */

/* ---------- Women · Veil lift (layered gradient + clip-path + gold motes) ---------- */
.nwks-veil-layer{position:absolute;inset:-6% -6%;
  background:
    linear-gradient(180deg,rgba(250,246,241,.98) 0%,rgba(250,246,241,.93) 42%,rgba(239,231,220,.86) 100%),
    repeating-linear-gradient(115deg,rgba(181,152,79,.06) 0 3px,transparent 3px 9px);
  clip-path:inset(50% 50% 50% 50%);transform:translateY(0);filter:blur(8px);opacity:0;
  will-change:clip-path,opacity,filter,transform}
.nwks-veil-light{position:absolute;inset:0;
  background:radial-gradient(60% 55% at 50% 100%,rgba(181,152,79,.6),transparent 72%);
  opacity:0;mix-blend-mode:screen;will-change:opacity,transform}

</style>
<style>
/* transitions-men.css — static CSS for the men's-door non-geometric concept
   set (src/js/transitions/men-dawn.js, men-banner.js, men-ink.js,
   men-embers.js). Owned by transitions-coder. Shared harness base
   (.nwks-tx-cover, .nwks-tx-canvas, reduced-motion kill-switch) lives in
   src/styles/transitions.css — not duplicated or overridden here. Per-frame
   values (opacity, transform, clip-path) are set inline by the modules; this
   file owns only each concept's static layout/base visuals, class-prefixed
   per concept so they can't collide with each other or with the women's
   door set (src/styles/transitions-women.css). */

/* ---- men-dawn ---- */
/* The horizon-glow layer men-dawn.js animates (opacity/scale/translateY are
   set per-frame in JS; the gradient itself — gold at the source fading
   through olive toward the edges — is static here). Sized larger than the
   viewport so its soft edges clear the corners at full scale. The canvas
   rays layer needs no extra rules beyond the shared .nwks-tx-canvas base. */
.mx-dawn__glow{position:absolute;left:-15%;right:-15%;bottom:-25%;height:150%;
  transform-origin:50% 100%;
  background:radial-gradient(65% 75% at 50% 100%,var(--m-yellow) 0%,var(--m-olive) 48%,var(--m-gun) 78%,transparent 100%);
  opacity:0;pointer-events:none;will-change:opacity,transform}

/* ---- men-banner ---- */
/* Pure Canvas 2D (the woven leading/trailing edge and the FREEDOM label are
   drawn per-frame — a wavy line can't be expressed as a static CSS shape).
   No extra layers or rules needed beyond the shared .nwks-tx-canvas base. */

/* ---- men-ink ---- */
/* Pure Canvas 2D (blot radial gradients, flung droplets and smoke wisps are
   all drawn per-frame). No extra layers or rules needed beyond the shared
   .nwks-tx-canvas base. */

/* ---- men-embers ---- */
/* Pure Canvas 2D (the forge field, heat-shimmer lines and rising embers are
   all drawn per-frame, using canvas shadowBlur for the ember glow rather
   than a CSS blend layer, so the opaque cover-phase fill can't be
   accidentally lightened by a blend mode). No extra layers or rules needed
   beyond the shared .nwks-tx-canvas base. */

</style>
<style>
/* transitions-women.css — static per-concept layer styles for the women's
   door "Fireflies" entrance concept (hero, and only concept on this door).
   Owned exclusively by transitions-coder; every rule is class-prefixed
   wx-fireflies so nothing here can collide with the men's shard field or
   any other DOM. Per-frame values (clip-path, opacity, filter) are set
   inline by the concept's run(); this file only owns base layout and
   static visual identity. Shares .nwks-tx-cover / .nwks-tx-canvas from
   transitions.css for the harness cover layer + canvas sizing.

   Palette: white + baby pink + warm gold, swelling over a soft dusk-plum
   backdrop so the glowing bokeh reads with real depth and contrast instead
   of floating on flat white. Deliberately NOT the men's olive/military look
   (src/styles/tokens.css --m-*). */

:root {
  --wx-white: #FFFFFF;
  --wx-pink-light: #F8D9E0;
  --wx-pink: #F4C6D2;
  --wx-gold: #C9A96A;
}

/* shared base for every full-bleed layer the concept appends to coverEl */
.wx-layer {
  position: absolute;
  inset: 0;
  pointer-events: none;
  will-change: opacity, clip-path, filter;
}

/* soft dusk-plum backdrop the fireflies gather against — gives the glow
   real contrast/depth instead of floating on flat white */
.wx-fireflies__field {
  background: radial-gradient(120% 90% at 50% 58%, #3a2438 0%, #221530 55%, #120c1c 100%);
  opacity: 0;
}

/* the luminous bloom the gathered fireflies swell into — full coverage at
   the covered midpoint is what actually hides the DOM swap */
.wx-fireflies__bloom {
  background: radial-gradient(50% 50% at 50% 50%,
      #FFFFFF 0%,
      rgba(255, 255, 255, .97) 22%,
      rgba(248, 217, 224, .95) 48%,
      rgba(244, 198, 210, .9) 70%,
      rgba(201, 169, 106, .38) 88%,
      rgba(201, 169, 106, 0) 100%);
  clip-path: circle(0% at 50% 50%);
  opacity: 0;
  filter: blur(11px);
}

@media (prefers-reduced-motion: reduce) {
  .wx-layer {
    display: none;
  }
}

</style>

<!-- LOAD ORDER RULE (see src/js/transition-core.js for the full contract doc):
     registry.js (creates NWKS.transitions={}) -> content/worlds -> transition-core.js
     (defines NWKS.tx) -> transitions/*.js (any order/count — each self-registers
     into NWKS.transitions) -> app.js (must load LAST; calls NWKS.tx.run(...) and
     builds the concept switcher from whatever registered above). Adding a new
     concept = add one more script tag for js/transitions/your-file.js anywhere
     in the transitions/*.js block below. -->
<script>
window.NWKS = window.NWKS || {};

/* Transition registry.
   Contract (owned by transitions-coder per module; full detail + rationale in
   src/js/transition-core.js, which every module is validated against):
   NWKS.transitions['<id>'] = {
     id, label, door: 'men'|'women',
     run(coverEl, ctx) => Promise<void>
       // ctx = { dir:'enter'|'exit', door, reduced, cover(), swap(), uncover() }
       // animates coverEl to FULLY cover the screen, calls ctx.swap() at the
       // covered midpoint (the only sanctioned DOM swap), then uncovers and
       // resolves. Must handle both dir values. Target: ~600-800ms total.
   };
*/
NWKS.transitions = NWKS.transitions || {};

NWKS.registry = {
  // Which concept is active for a given door. Defaults chosen away from the
  // geometric shatter (operator disliked it): Men's = Dawn, Women's = Fireflies.
  // The concept switcher lets the operator flip through all registered options.
  _active: { men: 'men-banner', women: 'women-banner' },

  getActive: function (door) {
    if (this._active[door]) return this._active[door];
    return door === 'women' ? 'women-banner' : 'men-banner';
  },

  setActive: function (door, id) {
    this._active[door] = id;
  },

  // All registered transition ids for a door, in registration order.
  list: function (door) {
    var ids = [];
    for (var id in NWKS.transitions) {
      if (Object.prototype.hasOwnProperty.call(NWKS.transitions, id) && NWKS.transitions[id].door === door) {
        ids.push(id);
      }
    }
    return ids;
  }
};

</script>

<script>
window.NWKS = window.NWKS || {};

/* Owned by worlds-coder.
   Contract: NWKS.worlds = { render(door), close(door) }
   - render(door): builds DOM into #world-<door> from NWKS.content[door], includes a back control.
   - close(door): tears down / hides the world (called on browser Back / popstate).

   Content block shapes accepted inside section.blocks[] (see src/content/*.js):
     - a plain string           -> paragraph
     - { list: [...] }          -> bullet list
     - { link: { label, href } } -> inline call-to-action link (opens in a new tab) */
(function () {
  'use strict';

  function el(tag, opts) {
    var node = document.createElement(tag);
    opts = opts || {};
    if (opts.className) node.className = opts.className;
    if (opts.text) node.textContent = opts.text;
    return node;
  }

  function externalLink(text, href) {
    var a = el('a', { text: text });
    a.href = href;
    a.target = '_blank';
    a.rel = 'noopener';
    return a;
  }

  function renderBlock(container, block) {
    if (typeof block === 'string') {
      container.appendChild(el('p', { className: 'world-p', text: block }));
      return;
    }
    if (block && block.list) {
      var ul = el('ul', { className: 'world-list' });
      block.list.forEach(function (item) {
        ul.appendChild(el('li', { text: item }));
      });
      container.appendChild(ul);
      return;
    }
    if (block && block.link) {
      var p = el('p', { className: 'world-p world-p--link' });
      p.appendChild(externalLink(block.link.label, block.link.href));
      container.appendChild(p);
    }
  }

  function renderContact(list, contact) {
    var row = el('li', { className: 'world-contact' });
    row.appendChild(el('span', { className: 'world-contact__name', text: contact.name || '' }));
    if (contact.phone) {
      var tel = el('a', { className: 'world-contact__link', text: contact.phone });
      tel.href = 'tel:' + contact.phone.replace(/[^0-9+]/g, '');
      row.appendChild(tel);
    }
    if (contact.email) {
      var mail = el('a', { className: 'world-contact__link', text: contact.email });
      mail.href = 'mailto:' + contact.email;
      row.appendChild(mail);
    }
    list.appendChild(row);
  }

  // ---- ambient background canvases (Task 1: men = warm embers/sparks drifting up,
  // women = baby-pink "pixie dust" drifting up). One <canvas> per door, position:fixed,
  // painted behind the world content (see .world-ambient in worlds.css — the canvas gets
  // a negative z-index inside the .world stacking context created via isolation:isolate,
  // so it sits above the flat world background but below all text/UI). Lifecycle is
  // independent of the idempotent content build: destroyed in close(), and (re)started at
  // the top of every render(door) call so it always matches the world that's open. ----
  var ambient = {};

  function rand(min, max) { return min + Math.random() * (max - min); }

  function ambientPalette(door) {
    return door === 'women'
      ? { fill: '255,190,212', glow: '255,170,200' }   // baby pink pixie dust
      : { fill: '255,189,92', glow: '255,140,40' };    // warm ember/spark
  }

  function makeAmbientParticle(door, w, h, seedAnywhere) {
    var women = door === 'women';
    return {
      x: rand(0, w),
      y: seedAnywhere ? rand(-0.05 * h, h) : (h + rand(4, 40)),
      r: women ? rand(1.6, 4.4) : rand(1.1, 3.4),
      speed: women ? rand(16, 40) : rand(30, 72),   // px/sec upward (embers faster)
      swayA: rand(6, 26),
      swayF: rand(0.4, 1.1),
      ph: rand(0, Math.PI * 2),
      flickF: women ? rand(2, 5) : rand(7, 15),      // flicker speed (embers flicker fast)
      flickPh: rand(0, Math.PI * 2),
      maxA: rand(0.55, 1.0),
      bright: Math.random() < (women ? 0.28 : 0.4)   // some burn brighter
    };
  }

  function startAmbient(worldEl, door) {
    stopAmbient(door);
    var probe = document.createElement('canvas');
    if (!probe.getContext) return; // no canvas support — skip silently, never block content

    var reduced = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
    var canvas = el('canvas', { className: 'world-ambient' });
    canvas.setAttribute('aria-hidden', 'true');
    worldEl.insertBefore(canvas, worldEl.firstChild || null);

    var ctx = canvas.getContext('2d');
    if (!ctx) return;
    var palette = ambientPalette(door);
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var w = 0, h = 0, particles = [], raf = null, lastT = null, lastPaintAt = null, watchdog = null, frameTime = 0;
    var alive = true;

    function targetCount() {
      var n = Math.round((w * h) / 11000);
      var cap = door === 'women' ? 74 : 56;
      return Math.max(30, Math.min(cap, n));
    }

    function seed() {
      var n = targetCount();
      particles = [];
      for (var i = 0; i < n; i++) particles.push(makeAmbientParticle(door, w, h, true));
    }

    function resize() {
      w = window.innerWidth;
      h = window.innerHeight;
      canvas.width = Math.max(1, Math.round(w * dpr));
      canvas.height = Math.max(1, Math.round(h * dpr));
      canvas.style.width = w + 'px';
      canvas.style.height = h + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      seed();
    }

    function paint(staticFrame) {
      ctx.clearRect(0, 0, w, h);
      var men = door === 'men';
      ctx.globalCompositeOperation = men ? 'lighter' : 'source-over'; // embers glow additively on olive
      for (var i = 0; i < particles.length; i++) {
        var p = particles[i];
        var flick = staticFrame ? 0.85 : (0.5 + 0.5 * Math.sin(frameTime * p.flickF + p.flickPh));
        var lifeTop = p.y < h * 0.16 ? Math.max(0, p.y / (h * 0.16)) : 1; // cool/fade near the top
        var a = p.maxA * flick * lifeTop * (p.bright ? 1 : 0.7);
        if (a <= 0.02) continue;
        var x = p.x + (staticFrame ? 0 : Math.sin(frameTime * p.swayF + p.ph) * p.swayA);
        var rad = p.r * (p.bright ? 3.4 : 2.7);
        var g = ctx.createRadialGradient(x, p.y, 0, x, p.y, rad);
        if (men) {
          g.addColorStop(0, 'rgba(255,246,214,' + a + ')');            // hot white-gold core
          g.addColorStop(0.3, 'rgba(255,150,48,' + (a * 0.8) + ')');   // orange
          g.addColorStop(1, 'rgba(255,88,18,0)');                      // red, transparent
        } else {
          g.addColorStop(0, 'rgba(255,255,255,' + a + ')');            // bright sparkle core
          g.addColorStop(0.32, 'rgba(244,140,192,' + (a * 0.85) + ')');// pink
          g.addColorStop(1, 'rgba(240,128,182,0)');
        }
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(x, p.y, rad, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalCompositeOperation = 'source-over';
    }

    function frame(t) {
      if (lastT == null) lastT = t;
      var dt = Math.min((t - lastT) / 1000, 0.05);
      lastT = t;
      frameTime += dt;
      for (var i = 0; i < particles.length; i++) {
        var p = particles[i];
        p.y -= p.speed * dt;
        if (p.y < -p.r * 4) particles[i] = makeAmbientParticle(door, w, h, false);
      }
      paint(false);
      lastPaintAt = (window.performance && performance.now) ? performance.now() : Date.now();
      raf = requestAnimationFrame(frame);
    }

    var onResize = function () { resize(); if (reduced) paint(true); };
    resize();

    if (reduced) {
      paint(true); // one static, non-animated frame — no rAF loop, no watchdog needed
    } else {
      raf = requestAnimationFrame(frame);
      lastPaintAt = (window.performance && performance.now) ? performance.now() : Date.now();
      // Watchdog: the site's masked-swap transition harness (transition-core.js)
      // globally monkey-patches requestAnimationFrame/cancelAnimationFrame for the
      // duration of the enter/exit cover animation and cancels whatever frame is
      // still in flight when it settles — including this loop's pending frame, since
      // it's chained via the same global rAF. That silently kills the self-chaining
      // loop with no way for it to notice and restart itself. This interval checks
      // for a stall and re-arms the chain — cheap, and inert once the loop is healthy.
      watchdog = setInterval(function () {
        if (!alive) return;
        var now = (window.performance && performance.now) ? performance.now() : Date.now();
        if (lastPaintAt != null && (now - lastPaintAt) > 500) {
          lastT = null; // avoid a large dt jump on the resumed frame
          raf = requestAnimationFrame(frame);
        }
      }, 400);
    }
    window.addEventListener('resize', onResize);

    ambient[door] = {
      destroy: function () {
        alive = false;
        if (raf) cancelAnimationFrame(raf);
        if (watchdog) clearInterval(watchdog);
        window.removeEventListener('resize', onResize);
        if (canvas.parentNode) canvas.parentNode.removeChild(canvas);
      }
    };
  }

  function stopAmbient(door) {
    if (ambient[door]) {
      ambient[door].destroy();
      delete ambient[door];
    }
  }

  function registerNav(content, extraClass) {
    var nav = el('nav', { className: 'world-register' + (extraClass ? ' ' + extraClass : '') });
    (content.register || []).forEach(function (r) {
      nav.appendChild(externalLink(r.label, r.href));
      nav.lastChild.className = 'world-register__btn';
    });
    return nav;
  }

  // Full-screen register form page (Task: Register is its own page, not inline in
  // the world). Plain show/hide via [hidden] — never touches history; app.js owns
  // history/back for the gateway. Builds all native-form specs for this door up
  // front (idempotent, cheap) so opening any of them is instant.
  function buildFormPage(worldEl, door, specKeys) {
    var page = el('div', { className: 'world-formpage' });
    page.hidden = true;

    var header = el('div', { className: 'world-formpage__header' });
    var backLabel = door === 'men' ? "Men's Encounter" : "Women's Encounter";
    var back = el('button', { className: 'world-formpage__back', text: '← Back to ' + backLabel });
    back.type = 'button';
    back.addEventListener('click', function () { page.hidden = true; });
    header.appendChild(back);
    page.appendChild(header);

    var scroll = el('div', { className: 'world-formpage__scroll' });
    page.appendChild(scroll);

    var panels = {};
    specKeys.forEach(function (key) {
      var spec = NWKS.forms.specs && NWKS.forms.specs[key];
      if (!spec) return;
      var panel = el('div', { className: 'world-formpage__panel' });
      panel.hidden = true;
      panel.appendChild(el('h2', { className: 'world-formpage__title', text: spec.title || '' }));
      var mount = el('div', { className: 'world-register__form' });
      panel.appendChild(mount);
      NWKS.forms.render(key, mount);
      scroll.appendChild(panel);
      panels[key] = panel;
    });

    worldEl.appendChild(page);

    return {
      open: function (key) {
        if (!panels[key]) return;
        Object.keys(panels).forEach(function (k) { panels[k].hidden = (k !== key); });
        page.hidden = false;
        scroll.scrollTop = 0;
      }
    };
  }

  NWKS.worlds = {
    render: function (door) {
      var worldEl = document.getElementById('world-' + door);
      if (!worldEl) return;
      var content = (NWKS.content && NWKS.content[door]) || {};

      // Idempotent: already built for this content — nothing to rebuild. Visibility
      // is owned by the masked-swap harness (transition-core doSwap), NEVER here —
      // revealing the world in render() is what caused the "instant jump then a
      // pointless overlay" bug (render runs before the transition covers the screen).
      // Ambient background is the one exception: it's restarted on every door-entry
      // (its own lifecycle, torn down in close()) even when content is already built.
      if (worldEl.dataset.builtFor === door) {
        /* ambient background removed per operator */
        return;
      }

      worldEl.innerHTML = '';
      worldEl.className = 'world world--' + door;
      /* ambient background removed per operator */

      // ---- sticky header: event name + back control ----
      var header = el('header', { className: 'world-header' });
      var back = el('button', { className: 'world-back', text: '← Back to main page' });
      back.type = 'button';
      back.setAttribute('data-back', door);
      header.appendChild(back);
      header.appendChild(el('div', { className: 'world-header__name', text: content.eventName || door }));
      worldEl.appendChild(header);

      // ---- hero: logo, title, tagline, dates, primary Register CTA ----
      var hero = el('section', { className: 'world-hero' });
      var logo = el('div', { className: 'world-hero__logo world-hero__logo--' + door });
      logo.setAttribute('role', 'img');
      logo.setAttribute('aria-label', content.eventName || door);
      hero.appendChild(logo);
      hero.appendChild(el('h1', { className: 'world-hero__title', text: content.eventName || '' }));
      if (content.tagline) {
        hero.appendChild(el('p', { className: 'world-hero__tagline', text: content.tagline }));
      }
      if (content.dates) {
        hero.appendChild(el('p', { className: 'world-hero__dates', text: content.dates }));
      }
      // Uniform registration (both doors): the hero shows TWO CTAs — Attendee opens the
      // real native form, Server opens a panel (a real form when one exists, or a
      // "currently closed" notice — see src/content/forms.js + src/js/forms.js).
      var formSpecKeys = door === 'men' ? { attendee: 'menAttendee', server: 'menServer' }
        : (door === 'women' ? { attendee: 'women', server: 'womenServer' } : null);
      var hasNativeForm = !!(formSpecKeys && NWKS.forms && NWKS.forms.specs &&
        NWKS.forms.specs[formSpecKeys.attendee]);
      // Assigned below (after the world body is built) — both hero CTAs open panels
      // inside this same full-screen form page.
      var formPage = null;

      if (hasNativeForm) {
        var ctaGroup = el('div', { className: 'world-hero__cta-group' });

        var attendeeCta = el('button', { className: 'world-cta', text: 'Register as an Attendee' });
        attendeeCta.type = 'button';
        attendeeCta.addEventListener('click', function () { if (formPage) formPage.open(formSpecKeys.attendee); });
        ctaGroup.appendChild(attendeeCta);
        // Server registration removed for now — no Server form is currently open
        // (men's Google form is closed; there's no women's Server form). Re-add when available.

        hero.appendChild(ctaGroup);
      } else if (content.register && content.register.length) {
        var cta = externalLink(content.register[0].label, content.register[0].href);
        cta.className = 'world-cta';
        hero.appendChild(cta);
      }
      worldEl.appendChild(hero);

      // ---- body: What is… / Pre-Encounter / Weekend, then Cost, What to Bring, Contacts ----
      var body = el('div', { className: 'world-body' });

      (content.sections || []).forEach(function (section) {
        var sec = el('section', { className: 'world-section' });
        if (section.id) sec.id = section.id;
        sec.appendChild(el('h2', { className: 'world-section__title', text: section.title || '' }));
        (section.blocks || []).forEach(function (block) { renderBlock(sec, block); });
        body.appendChild(sec);
      });

      if (content.cost) {
        var costSec = el('section', { className: 'world-section world-section--cost' });
        costSec.id = 'cost';
        costSec.appendChild(el('h2', { className: 'world-section__title', text: 'Cost' }));
        costSec.appendChild(el('p', { className: 'world-p', text: content.cost }));
        body.appendChild(costSec);
      }

      if (content.bring && content.bring.length) {
        var bringSec = el('section', { className: 'world-section world-section--bring' });
        bringSec.id = 'bring';
        bringSec.appendChild(el('h2', { className: 'world-section__title', text: 'What to Bring' }));
        var bringList = el('ul', { className: 'world-list world-list--bring' });
        content.bring.forEach(function (item) { bringList.appendChild(el('li', { text: item })); });
        bringSec.appendChild(bringList);
        body.appendChild(bringSec);
      }

      if (content.contacts && content.contacts.length) {
        var contactSec = el('section', { className: 'world-section world-section--contacts' });
        contactSec.id = 'contacts';
        contactSec.appendChild(el('h2', { className: 'world-section__title', text: 'Contacts' }));
        var contactList = el('ul', { className: 'world-contacts' });
        content.contacts.forEach(function (c) { renderContact(contactList, c); });
        contactSec.appendChild(contactList);
        body.appendChild(contactSec);
      }

      worldEl.appendChild(body);

      // ---- Register: native-form doors (men/women) use ONLY the hero CTAs to open the
      // full-screen form page — no redundant bottom register section (operator: "the
      // register button's already at the top"). Any external-link door would keep a
      // small register link list here instead. ----
      if (content.register && content.register.length && !hasNativeForm) {
        var registerSec = el('section', { className: 'world-section world-section--register' });
        registerSec.id = 'register';
        registerSec.appendChild(el('h2', { className: 'world-section__title', text: 'Register' }));
        registerSec.appendChild(registerNav(content));
        worldEl.appendChild(registerSec);
      }

      if (content.verse) {
        var verseFooter = el('footer', { className: 'world-verse' });
        verseFooter.appendChild(el('p', { text: content.verse }));
        worldEl.appendChild(verseFooter);
      }

      if (hasNativeForm) {
        var formPageKeys = [formSpecKeys.attendee];
        formPage = buildFormPage(worldEl, door, formPageKeys);
      }

      worldEl.dataset.builtFor = door;
      // Do NOT reveal here — the masked-swap harness (transition-core doSwap) un-hides
      // the world at the covered midpoint so the swap is never visible.
    },

    close: function (door) {
      var worldEl = document.getElementById('world-' + door);
      if (worldEl) worldEl.hidden = true;
      stopAmbient(door);
      var stage = document.getElementById('stage');
      if (stage) stage.classList.remove('world-open');
    }
  };
})();

</script>
<script>
window.NWKS = window.NWKS || {};
NWKS.forms = NWKS.forms || {};

/* Owned by [forms builder].
   Contract: NWKS.forms.render(specKey, mountEl) — builds a themed native <form>
   from NWKS.forms.specs[specKey] (see src/content/forms.js) into mountEl, wires
   client-side required validation, and on submit POSTs directly to the Google
   Form's real formResponse endpoint with mode:'no-cors' (the response is opaque
   by design — Google Forms doesn't allow reading the result cross-origin, so we
   show an optimistic success message once the request is sent).
   Idempotent per mountEl: re-render calls after the first are no-ops. */
(function () {
  'use strict';

  function el(tag, opts) {
    var node = document.createElement(tag);
    opts = opts || {};
    if (opts.className) node.className = opts.className;
    if (opts.text) node.textContent = opts.text;
    return node;
  }

  function fieldBaseId(specKey, idx) {
    return 'nf-' + specKey + '-' + idx;
  }

  function buildHelp(id, text) {
    var p = el('p', { className: 'nwks-field__help', text: text });
    p.id = id;
    return p;
  }

  function appendRequiredMark(labelEl) {
    labelEl.appendChild(el('span', { className: 'nwks-field__required', text: ' *' }));
  }

  function buildLabel(forId, text, required) {
    var label = el('label', { className: 'nwks-field__label' });
    label.appendChild(document.createTextNode(text));
    if (required) appendRequiredMark(label);
    label.setAttribute('for', forId);
    return label;
  }

  function buildTextField(container, specKey, field, idx) {
    var id = fieldBaseId(specKey, idx);
    var wrap = el('div', { className: 'nwks-field' });
    wrap.appendChild(buildLabel(id, field.label, field.required));
    var input = field.type === 'textarea' ? el('textarea', { className: 'nwks-field__input nwks-field__input--area' })
      : el('input', { className: 'nwks-field__input' });
    if (field.type === 'textarea') { input.rows = 4; }
    else { input.type = field.type === 'date' ? 'date' : 'text'; }
    input.id = id;
    input.name = field.name;
    if (field.required) input.required = true;
    // Cross-field "must match another field" (e.g. Confirm Email) — validated on submit.
    if (field.matchName) {
      input.dataset.matchName = field.matchName;
      if (field.matchLabel) input.dataset.matchLabel = field.matchLabel;
    }
    if (field.help) {
      var helpId = id + '-help';
      input.setAttribute('aria-describedby', helpId);
      wrap.appendChild(input);
      wrap.appendChild(buildHelp(helpId, field.help));
    } else {
      wrap.appendChild(input);
    }
    container.appendChild(wrap);
  }

  function buildSelectField(container, specKey, field, idx) {
    var id = fieldBaseId(specKey, idx);
    var wrap = el('div', { className: 'nwks-field' });
    wrap.appendChild(buildLabel(id, field.label, field.required));
    var select = el('select', { className: 'nwks-field__input nwks-field__input--select' });
    select.id = id;
    select.name = field.name;
    if (field.required) select.required = true;
    var blank = el('option', { text: 'Select…' });
    blank.value = '';
    select.appendChild(blank);
    (field.options || []).forEach(function (optLabel) {
      var opt = el('option', { text: optLabel });
      opt.value = optLabel;
      select.appendChild(opt);
    });
    wrap.appendChild(select);
    if (field.help) wrap.appendChild(buildHelp(id + '-help', field.help));
    container.appendChild(wrap);
  }

  function buildChoiceField(container, specKey, field, idx) {
    var isCheckbox = field.type === 'checkbox';
    var fs = el('fieldset', { className: 'nwks-field nwks-field--choice' });
    var legend = el('legend', { className: 'nwks-field__label' });
    legend.appendChild(document.createTextNode(field.label));
    if (field.required) appendRequiredMark(legend);
    fs.appendChild(legend);
    if (field.help) fs.appendChild(buildHelp(fieldBaseId(specKey, idx) + '-help', field.help));
    var optsWrap = el('div', { className: 'nwks-field__options' });
    var otherInput = null;
    (field.options || []).forEach(function (optLabel, optIdx) {
      var optId = fieldBaseId(specKey, idx) + '-o' + optIdx;
      var row = el('div', { className: 'nwks-option' });
      var input = el('input', { className: 'nwks-option__input' });
      input.type = isCheckbox ? 'checkbox' : 'radio';
      input.id = optId;
      input.name = field.name;
      var isOtherOpt = !!field.otherEntry && optLabel === 'Other';
      input.value = isOtherOpt ? '__other_option__' : optLabel;
      if (field.required) input.required = true;
      row.appendChild(input);
      var lab = el('label', { className: 'nwks-option__label', text: optLabel });
      lab.setAttribute('for', optId);
      row.appendChild(lab);
      if (isOtherOpt) {
        otherInput = el('input', { className: 'nwks-option__other-input' });
        otherInput.type = 'text';
        otherInput.name = field.otherEntry;
        otherInput.disabled = true;
        otherInput.setAttribute('aria-label', field.label + ' — please specify');
        row.appendChild(otherInput);
      }
      input.addEventListener('change', function () {
        if (!otherInput) return;
        otherInput.disabled = !isOtherOpt;
        if (isOtherOpt) otherInput.focus();
      });
      optsWrap.appendChild(row);
    });
    fs.appendChild(optsWrap);
    container.appendChild(fs);
  }

  function buildClosedNotice(mountEl, spec) {
    var notice = el('div', { className: 'nwks-form nwks-form--closed' });
    notice.appendChild(el('p', { className: 'nwks-form__closed-msg',
      text: spec.closedMessage || 'This registration form is currently closed.' }));
    if (spec.officialUrl) {
      var link = el('a', { className: 'nwks-form__fallback-link', text: 'Check the official Google form ↗' });
      link.href = spec.officialUrl;
      link.target = '_blank';
      link.rel = 'noopener';
      notice.appendChild(link);
    }
    mountEl.appendChild(notice);
  }

  function buildFallbackLink(spec) {
    var p = el('p', { className: 'nwks-form__fallback' });
    p.appendChild(document.createTextNode('Prefer the official Google form? '));
    var link = el('a', { className: 'nwks-form__fallback-link', text: 'Open it here ↗' });
    link.href = spec.officialUrl;
    link.target = '_blank';
    link.rel = 'noopener';
    p.appendChild(link);
    return p;
  }

  NWKS.forms.render = function (specKey, mountEl) {
    if (!mountEl) return;
    var spec = NWKS.forms.specs && NWKS.forms.specs[specKey];
    if (!spec) return;

    // Idempotent: don't rebuild an already-built mount for this spec.
    if (mountEl.dataset.builtFor === specKey) return;

    mountEl.innerHTML = '';
    mountEl.className = 'nwks-form-mount';

    if (spec.closed || !spec.fields || !spec.fields.length) {
      buildClosedNotice(mountEl, spec);
      mountEl.dataset.builtFor = specKey;
      return;
    }

    var form = el('form', { className: 'nwks-form' });

    spec.fields.forEach(function (field, idx) {
      if (field.type === 'radio' || field.type === 'checkbox') buildChoiceField(form, specKey, field, idx);
      else if (field.type === 'dropdown') buildSelectField(form, specKey, field, idx);
      else buildTextField(form, specKey, field, idx);
    });

    var statusEl = el('p', { className: 'nwks-form__status' });
    statusEl.setAttribute('role', 'status');
    statusEl.setAttribute('aria-live', 'polite');

    var submitBtn = el('button', { className: 'nwks-form__submit', text: 'Submit Registration' });
    submitBtn.type = 'submit';

    form.appendChild(submitBtn);
    form.appendChild(statusEl);

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      if (!form.checkValidity()) {
        form.reportValidity();
        statusEl.textContent = 'Please fill in all required fields.';
        statusEl.className = 'nwks-form__status nwks-form__status--error';
        return;
      }
      // Cross-field match check (e.g. Confirm Email must equal Email).
      var mismatch = null;
      Array.prototype.forEach.call(form.querySelectorAll('[data-match-name]'), function (inp) {
        if (mismatch) return;
        var target = form.querySelector('[name="' + inp.dataset.matchName + '"]');
        if (target && inp.value !== target.value) mismatch = inp;
      });
      if (mismatch) {
        var what = mismatch.dataset.matchLabel || 'those entries';
        statusEl.textContent = 'The ' + what + ' fields don’t match — please check and try again.';
        statusEl.className = 'nwks-form__status nwks-form__status--error';
        mismatch.focus();
        return;
      }
      submitBtn.disabled = true;
      statusEl.textContent = 'Submitting…';
      statusEl.className = 'nwks-form__status';
      fetch(spec.action, { method: 'POST', mode: 'no-cors', body: new FormData(form) })
        .then(function () {
          // no-cors -> opaque response; a resolved fetch is the best signal we get.
          statusEl.textContent = "Thanks — you're registered! (Google Forms doesn't let us confirm receipt directly, but your submission was sent.)";
          statusEl.className = 'nwks-form__status nwks-form__status--success';
          form.reset();
          submitBtn.disabled = false;
        })
        .catch(function () {
          statusEl.textContent = 'Something went wrong sending your registration — check your connection and try again, or use the official Google form link below.';
          statusEl.className = 'nwks-form__status nwks-form__status--error';
          submitBtn.disabled = false;
        });
    });

    mountEl.appendChild(form);
    mountEl.dataset.builtFor = specKey;
  };
})();

</script>
<script>
window.NWKS = window.NWKS || {};

/*
 * NWKS.tx — masked-swap transition harness (Phase 2, Stage 1).
 *
 * WHY: the old flow revealed the world FIRST and only hid the gateway once the
 * animation finished, so effects floated uselessly over an already-loaded page.
 * This harness fixes that structurally: a single opaque cover layer is what the
 * operator actually sees while the DOM swap happens; the swap itself is always
 * hidden underneath it, and never visible mid-transition.
 *
 * ============================================================================
 * CONCEPT CONTRACT (read this before adding a new transition file)
 * ============================================================================
 *   NWKS.transitions['<id>'] = {
 *     id: '<id>',
 *     label: 'Human label for the switcher dropdown',
 *     door: 'men' | 'women',
 *     run: function (coverEl, ctx) { ... return promise; }
 *   };
 *
 *   coverEl — a harness-owned <div>, position:fixed, inset:0, above everything
 *     (z-index), pointer-events:none, opacity:0 by default. Animate it directly
 *     (opacity/transform/clip-path/background) and/or append child nodes to it
 *     (a <canvas>, gradient layers, etc.) — NEVER touch any other DOM node.
 *     coverEl is a positioning context, so children may use position:absolute;
 *     inset:0 to fill it.
 *
 *   ctx = { dir, door, reduced, cover(), swap(), uncover() }
 *     dir      — 'enter' or 'exit'. Same concept must handle both: 'enter'
 *                swaps gateway -> world, 'exit' swaps world -> gateway. A
 *                mirrored/reversed version of the same cover motion is fine.
 *     door     — 'men' | 'women' (matches concept.door).
 *     reduced  — always false when run() is called (the harness already
 *                short-circuits reduced-motion before invoking a concept).
 *     cover()  — snaps coverEl to a fully-opaque, full-viewport covering state
 *                INSTANTLY. Call this as the authoritative "screen is masked"
 *                signal right before swap() — a safety net so the swap is
 *                genuinely hidden even if your own decorative animation (e.g.
 *                a shard field with gaps) isn't literally 100% opaque yet.
 *     swap()   — performs the real DOM swap (gateway <-> world) ATOMICALLY.
 *                Call this ONLY once, at the covered midpoint (immediately
 *                after cover()). Concepts never touch stage/world DOM state
 *                directly — this is the only sanctioned way to swap.
 *     uncover()— snaps coverEl to fully transparent instantly. Concepts
 *                normally animate their own graceful uncover and call this
 *                (or just fade coverEl's opacity to 0 themselves) right
 *                before resolving.
 *
 *   Sequence every concept must follow: animate coverEl to full coverage ->
 *   cover() -> swap() -> animate coverEl back to uncovered -> uncover() ->
 *   resolve(). Must resolve only once the swapped DOM is genuinely visible.
 *
 *   SPEED TARGET: total run() time ~600-800ms (fast — this replaces the old
 *   0.9-1.4s band per operator feedback that transitions were too slow).
 *
 *   Registration: each concept file is a self-invoking IIFE that registers
 *   itself into NWKS.transitions at load time (see transitions/men-shatter.js
 *   and transitions/women-veil.js — the reference implementations).
 *
 * ============================================================================
 * LOAD ORDER RULE (index.html)
 * ============================================================================
 *   registry.js  (creates NWKS.transitions = {})
 *     -> content/*.js, worlds.js
 *     -> transition-core.js  (this file — defines NWKS.tx, reads NWKS.transitions)
 *     -> transitions/*.js    (each concept file; any order, any count)
 *     -> app.js              (calls NWKS.tx.run(...); must load LAST)
 *   New concept files just need one more script include for
 *   js/transitions/your-file.js added anywhere in the transitions/*.js block above.
 * ============================================================================
 */
(function () {
  'use strict';

  var SAFETY_TIMEOUT_MS = 4000; // hard cap: never leave the UI stuck mid-cover

  function stageEl() { return document.getElementById('stage'); }

  // ---- the one sanctioned DOM swap: gateway <-> world, always atomic ----
  function doSwap(dir, door) {
    var worldEl = document.getElementById('world-' + door);
    var stage = stageEl();
    if (dir === 'enter') {
      if (worldEl) worldEl.hidden = false;
      if (stage) stage.classList.add('world-open');
      // Chrome color follows the ATOMIC swap (can't stick/race like the async path did):
      // men's world -> olive body, women's world -> pearl body.
      document.body.setAttribute('data-view', door);
    } else {
      if (worldEl) worldEl.hidden = true;
      if (stage) stage.classList.remove('world-open');
      document.body.removeAttribute('data-view'); // back to the gateway split-chrome
    }
  }

  function createCoverLayer() {
    var el = document.createElement('div');
    el.className = 'nwks-tx-cover';
    el.setAttribute('aria-hidden', 'true');
    document.body.appendChild(el);
    return el;
  }

  // ---- MOBILE transition: a bulletproof CSS-opacity cover-fade ----
  // The canvas concepts (FREEDOM banner, veils, shatter) are desktop-tuned and
  // overflow/jank on phones — the FREEDOM word is sized off viewport width and
  // spills off a narrow portrait screen (verified in WebKit). On mobile we skip
  // them entirely: fade an opaque cover in, swap the DOM hidden underneath, fade
  // it out. No <canvas>, no requestAnimationFrame loop, no oversized text — it
  // cannot visually break, and it's GPU-composited so it's smooth on any phone.
  function simpleMobileFade(dir, door) {
    var coverEl = createCoverLayer();
    coverEl.style.background = '#FAF6F1'; // clean pearl, on-brand, never a harsh flash
    coverEl.style.opacity = '0';
    coverEl.style.transition = 'opacity 170ms ease';
    var stage = stageEl();
    if (stage) stage.classList.add('nwks-tx-active');
    return new Promise(function (resolve) {
      function cleanup() {
        if (coverEl.parentNode) coverEl.parentNode.removeChild(coverEl);
        if (stage) stage.classList.remove('nwks-tx-active');
        resolve();
      }
      var safety = setTimeout(cleanup, 1200); // never leave a cover stuck
      // fade the cover IN (double-rAF so the 0 -> 1 transition actually animates)
      requestAnimationFrame(function () {
        requestAnimationFrame(function () { coverEl.style.opacity = '1'; });
      });
      setTimeout(function () {
        doSwap(dir, door);            // swap hidden beneath the opaque cover
        coverEl.style.opacity = '0';  // fade cover out to reveal the new view
        setTimeout(function () { clearTimeout(safety); cleanup(); }, 190);
      }, 190);
    });
  }

  // ---- belt-and-suspenders rAF leak guard: track ids requested while a
  // concept's run() is in flight; cancel anything still pending once it
  // settles, so a concept that forgets to cancel its own loop can't leak. ----
  function withRafGuard(fn) {
    var pending = {};
    var nativeRAF = window.requestAnimationFrame.bind(window);
    var nativeCAF = window.cancelAnimationFrame.bind(window);
    window.requestAnimationFrame = function (cb) {
      var id = nativeRAF(function (ts) {
        delete pending[id];
        cb(ts);
      });
      pending[id] = true;
      return id;
    };
    window.cancelAnimationFrame = function (id) {
      delete pending[id];
      nativeCAF(id);
    };
    function restore() {
      window.requestAnimationFrame = nativeRAF;
      window.cancelAnimationFrame = nativeCAF;
      for (var id in pending) {
        if (Object.prototype.hasOwnProperty.call(pending, id)) nativeCAF(Number(id));
      }
    }
    var result;
    try {
      result = fn();
    } catch (e) {
      restore();
      throw e;
    }
    if (result && typeof result.then === 'function') {
      return result.then(
        function (v) { restore(); return v; },
        function (err) { restore(); throw err; }
      );
    }
    restore();
    return result;
  }

  NWKS.tx = {
    run: function (conceptId, opts) {
      opts = opts || {};
      var dir = opts.dir === 'exit' ? 'exit' : 'enter';
      var door = opts.door;
      var reduced = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
      var concept = conceptId && NWKS.transitions ? NWKS.transitions[conceptId] : null;
      if (concept && concept.door !== door) concept = null; // guard: mismatched/unregistered door

      // Reduced motion, or no concept registered for this door -> instant
      // swap, no cover layer, no animation.
      if (reduced || !concept || typeof concept.run !== 'function') {
        doSwap(dir, door);
        return Promise.resolve();
      }

      // Mobile/phone: never run the desktop-tuned canvas concepts — use the
      // bulletproof cover-fade instead (see simpleMobileFade above).
      var isMobile = !!(window.matchMedia && window.matchMedia('(max-width: 760px)').matches);
      if (isMobile) {
        return simpleMobileFade(dir, door);
      }

      var coverEl = createCoverLayer();
      var stageForFreeze = stageEl();
      if (stageForFreeze) stageForFreeze.classList.add('nwks-tx-active'); // freeze door hover-jerk
      var swapped = false;
      var settled = false;

      var ctx = {
        dir: dir,
        door: door,
        reduced: false,
        cover: function () {
          coverEl.classList.add('nwks-tx-cover--opaque');
        },
        uncover: function () {
          coverEl.classList.remove('nwks-tx-cover--opaque');
        },
        swap: function () {
          if (swapped) return;
          swapped = true;
          doSwap(dir, door);
        }
      };

      function teardown() {
        if (settled) return;
        settled = true;
        // Defensive: a concept that throws or resolves early without ever
        // calling swap() must not leave the UI stuck mid-transition.
        if (!swapped) doSwap(dir, door);
        if (coverEl.parentNode) coverEl.parentNode.removeChild(coverEl);
        if (stageForFreeze) stageForFreeze.classList.remove('nwks-tx-active');
      }

      return new Promise(function (resolve) {
        var timer = setTimeout(function () {
          teardown();
          resolve();
        }, SAFETY_TIMEOUT_MS);

        function finish() {
          clearTimeout(timer);
          teardown();
          resolve();
        }

        var ran;
        try {
          ran = withRafGuard(function () { return concept.run(coverEl, ctx); });
        } catch (e) {
          finish();
          return;
        }
        if (!ran || typeof ran.then !== 'function') {
          // Contract violation (run() must return a Promise) — recover gracefully.
          finish();
          return;
        }
        ran.then(finish, finish);
      });
    }
  };
})();

</script>
