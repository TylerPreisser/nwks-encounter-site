<script>
window.NWKS = window.NWKS || {};
NWKS.transitions = NWKS.transitions || {};

/* Owned by transitions-coder (Phase 2 non-geometric concept set). Follows the
   masked-swap contract (see src/js/transition-core.js for the full contract
   doc; men-shatter.js / women-veil.js are the reference implementations).
   Real effect = "Freedom Banner": an all-white cloth flag with bold black
   letter-spaced FREEDOM lettering unfurls across the screen (anchored off-
   screen left, free/trailing edge on the right), fully covers the viewport,
   the DOM swaps hidden underneath, then the same cloth sweeps away the same
   direction to reveal what's now underneath. Native Canvas 2D only, no
   libraries.

   IMPORTANT — this is a rewrite that removes a real defect: the previous
   implementation rendered the cloth as a vertical-strip MESH (many adjacent
   per-column fillRect/drawImage calls). Even with flat white columns, every
   column boundary leaves a faint anti-aliased seam, and dozens of repeated
   seams read as a field of faint vertical lines across the banner — visible
   in captured frames. The fix is structural, not cosmetic:
     - the covered region is ONE filled path per frame, not N column rects.
       The path is a simple polygon: a flat edge pinned to the screen side
       (x=0 while unfurling, x=w while withdrawing) and a single continuous
       wavy edge on the moving side, built by walking a handful of points
       down the height and connecting them — one gfx.fill() call, so there
       are zero internal seams. The wave is a function of Y (how far down
       the sweeping edge bows in/out), not a function of X-column-index, so
       nothing is ever sliced into strips.
     - FREEDOM is drawn directly by clipping to that same single path, then
       filling one flat white rect and drawing the word on top — no offscreen
       column-compositing, no drawImage slicing. The word is drawn once, with
       each of its 7 glyphs individually placed along a gentle static arc
       (per-glyph baseline offset), which reads as a soft banner curve without
       ever tearing a letterform across a column boundary (the earlier
       per-strip text approach both banded AND tore letters).
   Same run() handles 'enter' and 'exit' — geometry is identical either way,
   only the swapped DOM content differs. Total ~680ms. */
(function () {
  'use strict';

  var COVER_MS = 340;   // cloth unfurls left -> right to full coverage -> cover() + swap()
  var UNCOVER_MS = 340;  // cloth withdraws the same direction -> uncover() + resolve()
  var HOLD_MS = 450;     // full cloth + FREEDOM holds before it swipes out

  var CLOTH_WHITE = 'rgb(255,255,255)'; // pure white banner (operator: all-white)
  var TEXT_BLACK = '#0a0a0a';           // near-pure black FREEDOM text

  function clamp01(n) { return n < 0 ? 0 : n > 1 ? 1 : n; }
  function easeOutQuad(t) { return 1 - (1 - t) * (1 - t); }
  function easeInCubic(t) { return t * t * t; }

  // Manual letter-spaced text draw, each glyph individually placed along a
  // gentle static arc (max bow at the center letter, tapering to ~0 at both
  // ends) — a soft banner curve with no per-column slicing, so nothing can
  // tear a letterform apart frame to frame.
  function drawFreedomGlyphs(g, text, cx, cy, spacing, curveAmp) {
    var widths = [];
    var total = 0;
    var i;
    for (i = 0; i < text.length; i++) {
      var wch = g.measureText(text[i]).width;
      widths.push(wch);
      total += wch;
    }
    total += spacing * (text.length - 1);
    var x = cx - total / 2;
    g.textAlign = 'left';
    var last = text.length - 1;
    for (i = 0; i < text.length; i++) {
      var frac = last > 0 ? i / last : 0.5;       // 0..1 across the word
      var bow = Math.sin(frac * Math.PI);          // 0 at both ends, 1 at center
      var yOff = curveAmp * bow;
      g.fillText(text[i], x, cy + yOff);
      x += widths[i] + spacing;
    }
  }

  function run(coverEl, ctx) {
    return new Promise(function (resolve) {
      var w = window.innerWidth;
      var h = window.innerHeight;
      var dpr = Math.min(window.devicePixelRatio || 1, 2);

      var canvas = document.createElement('canvas');
      canvas.className = 'nwks-tx-canvas nwks-tx-canvas--banner';
      canvas.width = Math.max(1, Math.round(w * dpr));
      canvas.height = Math.max(1, Math.round(h * dpr));
      coverEl.appendChild(canvas);

      var gfx = canvas.getContext('2d');
      if (!gfx) {
        ctx.cover();
        ctx.swap();
        ctx.uncover();
        if (canvas.parentNode) canvas.parentNode.removeChild(canvas);
        resolve();
        return;
      }
      gfx.scale(dpr, dpr);

      // FREEDOM must read big and confident on mobile portrait, where the
      // old min(w,h)*0.115 rule sized off the SMALLER dimension — on a tall
      // phone that's the width, but 0.115 was tuned for a desktop aspect and
      // left the word tiny and lost in a huge white void. Fix: size off the
      // WORD'S RENDERED WIDTH so it always spans a fixed fraction of the
      // viewport width, regardless of aspect ratio. Measure the word (with
      // its letter-spacing) at a known base size, then solve for the font
      // size that makes it span the target width.
      var WORD_WIDTH_FRAC = 0.88; // FREEDOM should span ~88% of viewport width (top of the 82-88% band — max prominence on mobile portrait)
      var LETTER_SPACING_RATIO = 0.22;
      var BASE_PROBE_SIZE = 200;
      gfx.font = '900 ' + BASE_PROBE_SIZE + 'px "Arial Black", Arial, sans-serif';
      var probeSpacing = BASE_PROBE_SIZE * LETTER_SPACING_RATIO;
      var probeWidth = 0;
      for (var pi = 0; pi < 7; pi++) probeWidth += gfx.measureText('FREEDOM'[pi]).width;
      probeWidth += probeSpacing * 6;
      var fontSize = Math.round(BASE_PROBE_SIZE * (w * WORD_WIDTH_FRAC) / probeWidth);
      // Clamp: never absurd on an ultra-wide desktop (cap relative to height
      // so it can't overflow vertically or dwarf the arc), and never below a
      // sensible floor on a narrow phone.
      fontSize = Math.min(fontSize, Math.round(h * 0.32));
      fontSize = Math.max(fontSize, Math.round(Math.min(w, h) * 0.1));
      var letterSpacing = Math.round(fontSize * LETTER_SPACING_RATIO);
      var curveAmp = Math.min(22, h * 0.02); // gentle arc, subtle on purpose

      // Ripple amplitude/frequency of the single moving edge — a function of
      // Y only, so the boundary bows like real cloth without ever slicing
      // the fill into columns.
      var ampEdge = Math.min(26, w * 0.02);
      var edgeSpan = w + ampEdge * 2;
      var waveFreq = (Math.PI * 2 / h) * 1.6;
      var waveSpeed = 0.0035;

      function edgeX(y, t, edgePos) {
        return edgePos + ampEdge * Math.sin(y * waveFreq + t * waveSpeed) +
          ampEdge * 0.35 * Math.sin(y * waveFreq * 2.1 - t * waveSpeed * 1.4 + 1.3);
      }

      // Builds ONE continuous polygon path for the currently-covered region:
      //   phase 'in'  -> covered = [0, edgeX(y)]   (flat edge at x=0, wavy edge moving right)
      //   phase 'out' -> covered = [edgeX(y), w]   (flat edge at x=w, wavy edge moving right)
      // A single path + single fill == zero internal seams, by construction.
      var EDGE_STEPS = 28;
      function tracePath(phase, edgePos, t) {
        gfx.beginPath();
        var i, y, ex;
        if (phase === 'in') {
          gfx.moveTo(0, 0);
          gfx.lineTo(0, h);
          for (i = EDGE_STEPS; i >= 0; i--) {
            y = h * i / EDGE_STEPS;
            ex = edgeX(y, t, edgePos);
            gfx.lineTo(ex, y);
          }
        } else {
          gfx.moveTo(w, 0);
          gfx.lineTo(w, h);
          for (i = EDGE_STEPS; i >= 0; i--) {
            y = h * i / EDGE_STEPS;
            ex = edgeX(y, t, edgePos);
            gfx.lineTo(ex, y);
          }
        }
        gfx.closePath();
      }

      function drawCloth(t, phase, edgePos, textAlpha) {
        gfx.clearRect(0, 0, w, h);
        gfx.save();
        tracePath(phase, edgePos, t);
        gfx.clip();

        // Single solid fill for the entire covered region — flat white,
        // zero seams (this replaces the old per-column mesh entirely).
        gfx.fillStyle = CLOTH_WHITE;
        gfx.fillRect(0, 0, w, h);

        if (textAlpha > 0.01) {
          gfx.globalAlpha = clamp01(textAlpha);
          gfx.fillStyle = TEXT_BLACK;
          gfx.font = '900 ' + fontSize + 'px "Arial Black", Arial, sans-serif';
          gfx.textBaseline = 'middle';
          drawFreedomGlyphs(gfx, 'FREEDOM', w / 2, h / 2, letterSpacing, curveAmp);
          gfx.globalAlpha = 1;
        }
        gfx.restore();
      }

      var didSwap = false;
      var rafId = null;
      var start = null;
      var totalMs = COVER_MS + HOLD_MS + UNCOVER_MS;

      // Authoritative mask: an opaque inline background on coverEl guarantees
      // full opacity throughout the cover phase regardless of the ripple, so
      // the swap is genuinely hidden even before the canvas paints its first
      // frame.
      coverEl.style.background = CLOTH_WHITE;

      function frame(ts) {
        if (start === null) start = ts;
        var t = ts - start;

        if (t < COVER_MS) {
          var pIn = clamp01(t / COVER_MS);
          var edgePos = easeOutQuad(pIn) * edgeSpan - ampEdge;
          var textAlpha = clamp01((pIn - 0.55) / 0.4);
          drawCloth(t, 'in', edgePos, textAlpha);
        } else if (t < COVER_MS + HOLD_MS) {
          // HOLD: the full white cloth + FREEDOM lingers on screen; the DOM swap
          // happens hidden underneath here, then the cloth stays put for HOLD_MS.
          if (!didSwap) {
            didSwap = true;
            ctx.cover();
            ctx.swap();
            ctx.uncover();
            coverEl.style.background = 'transparent';
          }
          drawCloth(t, 'in', edgeSpan - ampEdge, 1);
        } else {
          var tOut = t - COVER_MS - HOLD_MS;
          var pOut = clamp01(tOut / UNCOVER_MS);
          var edgePosOut = easeInCubic(pOut) * edgeSpan - ampEdge;
          drawCloth(t, 'out', edgePosOut, 1);
        }

        if (t >= totalMs) {
          teardown();
          return;
        }
        rafId = requestAnimationFrame(frame);
      }

      rafId = requestAnimationFrame(frame);

      function teardown() {
        if (rafId !== null) cancelAnimationFrame(rafId);
        rafId = null;
        if (!didSwap) {
          ctx.cover();
          ctx.swap();
        }
        ctx.uncover();
        coverEl.style.background = '';
        if (canvas.parentNode) canvas.parentNode.removeChild(canvas);
        resolve();
      }
    });
  }

  NWKS.transitions['men-banner'] = {
    id: 'men-banner',
    label: 'Freedom Banner',
    door: 'men',
    run: run
  };
})();

<script>
window.NWKS = window.NWKS || {};
NWKS.transitions = NWKS.transitions || {};

/* Owned by transitions-coder. Follows the masked-swap contract (see
   src/js/transition-core.js for the full contract doc). Women's companion to
   men-banner.js — same "Freedom Banner" mechanic (Galatians 5:1 applies to
   both doors), a soft pale blush/ivory cloth with the word FREEDOM unfurling
   across the screen, but in an elegant, feminine palette: a very pale warm
   blush banner with the lettering in a deep dark-rose tone rather than flat
   black. Native Canvas 2D only, no libraries.

   Rendering approach is IDENTICAL in structure to the (rewritten) men-banner
   — this is deliberate: the earlier men's version rendered the cloth as a
   vertical-strip MESH (many adjacent per-column fillRect/drawImage calls),
   and even with flat columns every column boundary left a faint anti-aliased
   seam that repeated into a field of faint vertical lines. This file never
   had that bug, but it must never regain it, so it shares the same
   seam-proof construction as the fixed men-banner:
     - the covered region is ONE filled path per frame (a simple polygon: a
       flat edge pinned to the screen side, and a single continuous wavy edge
       on the moving side, built by walking a handful of points down the
       height) — one gfx.fill() call, zero internal seams. The wave is a
       function of Y only, never sliced into per-column strips.
     - FREEDOM is drawn directly by clipping to that same single path, then
       filling one flat blush rect and drawing the word on top — no offscreen
       column-compositing, no drawImage slicing. Each of the 7 glyphs is
       individually placed along a gentle static arc (per-glyph baseline
       offset), which reads as a soft banner curve without ever tearing a
       letterform across a column boundary.
   Same run() handles 'enter' and 'exit' — geometry is identical either way,
   only the swapped DOM content differs. Total ~680ms. */
(function () {
  'use strict';

  var COVER_MS = 340;   // cloth unfurls left -> right to full coverage -> cover() + swap()
  var UNCOVER_MS = 340;  // cloth withdraws the same direction -> uncover() + resolve()
  var HOLD_MS = 450;     // full cloth + FREEDOM holds before it swipes out

  var CLOTH_BLUSH = 'rgb(255,255,255)'; // same as men's — pure white
  var TEXT_ROSE = '#0a0a0a';            // same as men's — near-black FREEDOM

  function clamp01(n) { return n < 0 ? 0 : n > 1 ? 1 : n; }
  function easeOutQuad(t) { return 1 - (1 - t) * (1 - t); }
  function easeInCubic(t) { return t * t * t; }

  // Manual letter-spaced text draw, each glyph individually placed along a
  // gentle static arc (max bow at the center letter, tapering to ~0 at both
  // ends) — a soft banner curve with no per-column slicing, so nothing can
  // tear a letterform apart frame to frame.
  function drawFreedomGlyphs(g, text, cx, cy, spacing, curveAmp) {
    var widths = [];
    var total = 0;
    var i;
    for (i = 0; i < text.length; i++) {
      var wch = g.measureText(text[i]).width;
      widths.push(wch);
      total += wch;
    }
    total += spacing * (text.length - 1);
    var x = cx - total / 2;
    g.textAlign = 'left';
    var last = text.length - 1;
    for (i = 0; i < text.length; i++) {
      var frac = last > 0 ? i / last : 0.5;       // 0..1 across the word
      var bow = Math.sin(frac * Math.PI);          // 0 at both ends, 1 at center
      var yOff = curveAmp * bow;
      g.fillText(text[i], x, cy + yOff);
      x += widths[i] + spacing;
    }
  }

  function run(coverEl, ctx) {
    return new Promise(function (resolve) {
      var w = window.innerWidth;
      var h = window.innerHeight;
      var dpr = Math.min(window.devicePixelRatio || 1, 2);

      var canvas = document.createElement('canvas');
      canvas.className = 'nwks-tx-canvas nwks-tx-canvas--banner';
      canvas.width = Math.max(1, Math.round(w * dpr));
      canvas.height = Math.max(1, Math.round(h * dpr));
      coverEl.appendChild(canvas);

      var gfx = canvas.getContext('2d');
      if (!gfx) {
        ctx.cover();
        ctx.swap();
        ctx.uncover();
        if (canvas.parentNode) canvas.parentNode.removeChild(canvas);
        resolve();
        return;
      }
      gfx.scale(dpr, dpr);

      // FREEDOM must read big and confident on mobile portrait, where the
      // old min(w,h)*0.115 rule sized off the SMALLER dimension — on a tall
      // phone that's the width, but 0.115 was tuned for a desktop aspect and
      // left the word tiny and lost in a huge void. Fix: size off the WORD'S
      // RENDERED WIDTH so it always spans a fixed fraction of the viewport
      // width, regardless of aspect ratio. Measure the word (with its
      // letter-spacing) at a known base size, then solve for the font size
      // that makes it span the target width. Kept identical to men-banner.js
      // so both doors share the exact same sizing behavior.
      var WORD_WIDTH_FRAC = 0.88; // FREEDOM should span ~88% of viewport width (top of the 82-88% band — max prominence on mobile portrait)
      var LETTER_SPACING_RATIO = 0.22;
      var BASE_PROBE_SIZE = 200;
      gfx.font = '900 ' + BASE_PROBE_SIZE + 'px "Arial Black", Arial, sans-serif';
      var probeSpacing = BASE_PROBE_SIZE * LETTER_SPACING_RATIO;
      var probeWidth = 0;
      for (var pi = 0; pi < 7; pi++) probeWidth += gfx.measureText('FREEDOM'[pi]).width;
      probeWidth += probeSpacing * 6;
      var fontSize = Math.round(BASE_PROBE_SIZE * (w * WORD_WIDTH_FRAC) / probeWidth);
      // Clamp: never absurd on an ultra-wide desktop (cap relative to height
      // so it can't overflow vertically or dwarf the arc), and never below a
      // sensible floor on a narrow phone.
      fontSize = Math.min(fontSize, Math.round(h * 0.32));
      fontSize = Math.max(fontSize, Math.round(Math.min(w, h) * 0.1));
      var letterSpacing = Math.round(fontSize * LETTER_SPACING_RATIO);
      var curveAmp = Math.min(22, h * 0.02); // gentle arc, subtle on purpose

      // Ripple amplitude/frequency of the single moving edge — a function of
      // Y only, so the boundary bows like real cloth without ever slicing
      // the fill into columns.
      var ampEdge = Math.min(26, w * 0.02);
      var edgeSpan = w + ampEdge * 2;
      var waveFreq = (Math.PI * 2 / h) * 1.6;
      var waveSpeed = 0.0035;

      function edgeX(y, t, edgePos) {
        return edgePos + ampEdge * Math.sin(y * waveFreq + t * waveSpeed) +
          ampEdge * 0.35 * Math.sin(y * waveFreq * 2.1 - t * waveSpeed * 1.4 + 1.3);
      }

      // Builds ONE continuous polygon path for the currently-covered region:
      //   phase 'in'  -> covered = [0, edgeX(y)]   (flat edge at x=0, wavy edge moving right)
      //   phase 'out' -> covered = [edgeX(y), w]   (flat edge at x=w, wavy edge moving right)
      // A single path + single fill == zero internal seams, by construction.
      var EDGE_STEPS = 28;
      function tracePath(phase, edgePos, t) {
        gfx.beginPath();
        var i, y, ex;
        if (phase === 'in') {
          gfx.moveTo(0, 0);
          gfx.lineTo(0, h);
          for (i = EDGE_STEPS; i >= 0; i--) {
            y = h * i / EDGE_STEPS;
            ex = edgeX(y, t, edgePos);
            gfx.lineTo(ex, y);
          }
        } else {
          gfx.moveTo(w, 0);
          gfx.lineTo(w, h);
          for (i = EDGE_STEPS; i >= 0; i--) {
            y = h * i / EDGE_STEPS;
            ex = edgeX(y, t, edgePos);
            gfx.lineTo(ex, y);
          }
        }
        gfx.closePath();
      }

      function drawCloth(t, phase, edgePos, textAlpha) {
        gfx.clearRect(0, 0, w, h);
        gfx.save();
        tracePath(phase, edgePos, t);
        gfx.clip();

        // Single solid fill for the entire covered region — flat blush,
        // zero seams (no per-column mesh anywhere in this concept).
        gfx.fillStyle = CLOTH_BLUSH;
        gfx.fillRect(0, 0, w, h);

        if (textAlpha > 0.01) {
          gfx.globalAlpha = clamp01(textAlpha);
          gfx.fillStyle = TEXT_ROSE;
          gfx.font = '900 ' + fontSize + 'px "Arial Black", Arial, sans-serif';
          gfx.textBaseline = 'middle';
          drawFreedomGlyphs(gfx, 'FREEDOM', w / 2, h / 2, letterSpacing, curveAmp);
          gfx.globalAlpha = 1;
        }
        gfx.restore();
      }

      var didSwap = false;
      var rafId = null;
      var start = null;
      var totalMs = COVER_MS + HOLD_MS + UNCOVER_MS;

      // Authoritative mask: an opaque inline background on coverEl guarantees
      // full opacity throughout the cover phase regardless of the ripple, so
      // the swap is genuinely hidden even before the canvas paints its first
      // frame.
      coverEl.style.background = CLOTH_BLUSH;

      function frame(ts) {
        if (start === null) start = ts;
        var t = ts - start;

        if (t < COVER_MS) {
          var pIn = clamp01(t / COVER_MS);
          var edgePos = easeOutQuad(pIn) * edgeSpan - ampEdge;
          var textAlpha = clamp01((pIn - 0.55) / 0.4);
          drawCloth(t, 'in', edgePos, textAlpha);
        } else if (t < COVER_MS + HOLD_MS) {
          // HOLD: the full cloth + FREEDOM lingers on screen; the DOM swap happens
          // hidden underneath here, then the cloth stays put for HOLD_MS.
          if (!didSwap) {
            didSwap = true;
            ctx.cover();
            ctx.swap();
            ctx.uncover();
            coverEl.style.background = 'transparent';
          }
          drawCloth(t, 'in', edgeSpan - ampEdge, 1);
        } else {
          var tOut = t - COVER_MS - HOLD_MS;
          var pOut = clamp01(tOut / UNCOVER_MS);
          var edgePosOut = easeInCubic(pOut) * edgeSpan - ampEdge;
          drawCloth(t, 'out', edgePosOut, 1);
        }

        if (t >= totalMs) {
          teardown();
          return;
        }
        rafId = requestAnimationFrame(frame);
      }

      rafId = requestAnimationFrame(frame);

      function teardown() {
        if (rafId !== null) cancelAnimationFrame(rafId);
        rafId = null;
        if (!didSwap) {
          ctx.cover();
          ctx.swap();
        }
        ctx.uncover();
        coverEl.style.background = '';
        if (canvas.parentNode) canvas.parentNode.removeChild(canvas);
        resolve();
      }
    });
  }

  NWKS.transitions['women-banner'] = {
    id: 'women-banner',
    label: 'Freedom Banner',
    door: 'women',
    run: run
  };
})();

</script>
<script>
window.NWKS = window.NWKS || {};

/* Boot + core enter(door)/exit(door) orchestration. Depends on NWKS.registry,
   NWKS.transitions, NWKS.tx (transition-core.js), NWKS.worlds, NWKS.content —
   all loaded before this script (see load-order rule in transition-core.js). */
(function () {
  'use strict';

  var intro = document.getElementById('intro');
  var openDoor = null;
  var busy = false; // guards re-entrant enter/exit while a masked-swap animation is in flight

  // ---- boot: no intro/entrance animation — remove any legacy overlay immediately ----
  if (intro && intro.parentNode) intro.parentNode.removeChild(intro);

  // ---- boot: ONLY the Enter button triggers entry (not the whole half) ----
  var doors = document.querySelectorAll('.half[data-door]');
  Array.prototype.forEach.call(doors, function (doorEl) {
    var door = doorEl.getAttribute('data-door');
    var enterBtn = doorEl.querySelector('.enter');
    if (enterBtn) {
      enterBtn.addEventListener('click', function (e) {
        e.stopPropagation();
        enter(door);
      });
    }
  });

  // ---- back affordance: worlds render a [data-back] control; delegate its click ----
  document.addEventListener('click', function (e) {
    var backBtn = e.target && e.target.closest ? e.target.closest('[data-back]') : null;
    if (backBtn) {
      e.preventDefault();
      history.back();
    }
  });

  // ---- browser Back reverses via NWKS.worlds.close(door) ----
  window.addEventListener('popstate', function () {
    if (openDoor) exit(openDoor);
  });

  // ---- core orchestration ----
  // Both enter and exit route through NWKS.tx.run(), the masked-swap harness:
  // the cover layer fully hides the screen BEFORE the DOM swap happens, so
  // nothing is ever revealed-then-hidden. Same path both directions means
  // Back animates too, at the same fast (~600-800ms) speed as entry.
  function enter(door) {
    if (openDoor || busy) return; // a world is already open, or a transition is mid-flight
    var worldEl = document.getElementById('world-' + door);
    if (!worldEl) return;

    busy = true;

    // populate the world's content before it can ever become visible
    if (NWKS.worlds && typeof NWKS.worlds.render === 'function') {
      NWKS.worlds.render(door);
    }

    var conceptId = NWKS.registry ? NWKS.registry.getActive(door) : null;

    NWKS.tx.run(conceptId, { dir: 'enter', door: door }).then(function () {
      busy = false;
      openDoor = door;
      // push history so browser Back returns to gateway (reversed via popstate -> exit)
      history.pushState({ nwksDoor: door }, document.title, '');
      worldEl.setAttribute('tabindex', '-1');
      worldEl.focus();
    });
  }

  function exit(door) {
    // No exit animation — going back to the main page is INSTANT (operator: only
    // animate on the way in). The gateway is already rendered underneath, so just
    // close the world.
    if (busy) return;
    openDoor = null;
    if (NWKS.worlds && typeof NWKS.worlds.close === 'function') {
      NWKS.worlds.close(door);
    }
    var doorEl = document.querySelector('.half[data-door="' + door + '"]');
    if (doorEl) {
      // .half is a non-focusable <section>; focus the door's real Enter button so
      // keyboard focus returns to the door the user came from, not <body>.
      var enterBtn = doorEl.querySelector('.enter');
      (enterBtn || doorEl).focus();
    }
  }

  // ---- boot: visible concept switcher — lists registered concepts per door,
  // built live from NWKS.transitions at boot (so it reflects however many
  // concept files are wired up, no hardcoded ids). Picks feed
  // NWKS.registry.setActive(); Enter then previews whatever is active. ----
  function buildConceptSwitcher() {
    var panel = document.getElementById('concept-switcher');
    if (!panel || !NWKS.registry) return;

    var switcherDoors = ['men', 'women'];
    var any = false;

    switcherDoors.forEach(function (door) {
      var select = panel.querySelector('[data-door="' + door + '"]');
      if (!select) return;
      var ids = NWKS.registry.list(door);
      if (!ids.length) return;

      select.innerHTML = '';
      ids.forEach(function (id) {
        var concept = NWKS.transitions[id];
        var opt = document.createElement('option');
        opt.value = id;
        opt.textContent = (concept && concept.label) || id;
        select.appendChild(opt);
      });
      select.value = NWKS.registry.getActive(door);
      select.addEventListener('change', function () {
        NWKS.registry.setActive(door, select.value);
      });
      any = true;
    });

    if (any) panel.hidden = false;
  }
  buildConceptSwitcher();
})();

</script>
