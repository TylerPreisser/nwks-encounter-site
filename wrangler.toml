# Backend project config (API + admin SPA). Deployed via `npm run deploy:backend`
# to the `nwks-encounter-backend` Pages project. The worlds front-end is a
# SEPARATE project (`nwks-encounter-site`) deployed via `npm run deploy:worlds`.
name = "nwks-encounter-backend"
pages_build_output_dir = "dist"
compatibility_date = "2026-07-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "nwks-encounter"
database_id = "5bcd5ebb-cb1f-4a10-8fca-00c11fea5d9b"
migrations_dir = "db/migrations"

# R2 (photo gallery) — re-enable once R2 is activated in the Cloudflare dashboard,
# then `wrangler r2 bucket create nwks-encounter-photos` and redeploy the backend.
# [[r2_buckets]]
# binding = "PHOTOS"
# bucket_name = "nwks-encounter-photos"

[[kv_namespaces]]
binding = "SESSIONS"
id = "f35ff27e301240d6bfa59ca344520f3e"

[vars]
EMAIL_ENABLED  = "true"
EMAIL_FROM     = "NWKS Encounter <noreply@nwksencounter.com>"
EMAIL_REPLY_TO = ""
CORS_ORIGINS   = "http://localhost:8788,http://localhost:8787,http://localhost:8080,http://127.0.0.1:8788,http://127.0.0.1:8080,https://nwks-encounter-site.pages.dev,https://nwksencounter.com,https://www.nwksencounter.com"
