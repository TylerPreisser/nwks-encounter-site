<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
<title>NWKS Encounter — Concept: Animated Gateway</title>
<style>
  :root{
    /* shared neutral frame — light warm stone + antique gold */
    --f-bg:#EAE3D4; --f-bg2:#E2DAC8; --f-ink:#2A2723; --f-gold:#9C8038; --f-rule:#cdbf9d;
    /* men signature */
    --m-olive:#3D4127; --m-olive-deep:#2A2D1B; --m-gun:#1B1D17; --m-yellow:#E6C12F;
    --m-bone:#E8E3D2; --m-dim:#b3ae99;
    /* women signature */
    --w-pearl:#FAF6F1; --w-pearl-deep:#EFE7DC; --w-ink:#2A2622; --w-gold:#B5984F; --w-gold-deep:#8c722f; --w-dim:#8a8175;
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:"Helvetica Neue",Arial,system-ui,sans-serif;background:#000;color:#fff;
    overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:relative;display:flex;width:100%;height:100vh;height:100dvh;overflow:hidden}

  /* ---------- UNIFORM HALF ---------- */
  .half{position:relative;flex:1 1 0;min-width:0;overflow:hidden;display:flex;flex-direction:column;
    align-items:center;justify-content:center;cursor:pointer;
    transition:flex-grow .7s cubic-bezier(.22,.61,.36,1),filter .7s ease}
  @media(hover:hover){
    .stage:hover .half{flex-grow:.82;filter:saturate(.85) brightness(.92)}
    .stage:hover .half:hover{flex-grow:1.5;filter:none}
  }
  .half__inner{position:relative;z-index:3;width:100%;display:flex;flex-direction:column;align-items:center;
    text-align:center;padding:calc(clamp(46px,6.5vh,62px) + 4vh) 7vw calc(78px + 4vh);
    transform:translateY(16px);opacity:0}
  .eyebrow{font-size:clamp(.62rem,1.05vw,.82rem);letter-spacing:.4em;text-transform:uppercase;
    font-weight:700;margin-bottom:2.4vh}
  .mark{width:clamp(200px,25vw,330px);max-width:72vw;animation:float 7s ease-in-out infinite}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  .rule{width:0;height:2px;margin:2vh auto 0}
  .dates{font-size:clamp(.78rem,1.3vw,1rem);letter-spacing:.14em;text-transform:uppercase;margin-top:1.3em}
  .enter{margin-top:3vh;display:inline-flex;align-items:center;gap:.7em;font-size:.72rem;
    letter-spacing:.32em;text-transform:uppercase;font-weight:700;padding:.95em 1.9em;border:1px solid;
    background:transparent;cursor:pointer;transition:all .35s ease;border-radius:2px}
  .enter .arr{transition:transform .35s ease}
  .enter:hover .arr{transform:translateX(6px)}

  /* ---------- MEN signature ---------- */
  .half--men{color:var(--m-bone);background:
    radial-gradient(120% 90% at 30% 8%, rgba(255,255,255,.07), transparent 55%),
    linear-gradient(155deg,var(--m-olive) 0%,var(--m-olive-deep) 58%,var(--m-gun) 100%)}
  .half--men::before{content:"";position:absolute;inset:-20%;z-index:1;opacity:.5;background-image:
    repeating-linear-gradient(115deg,rgba(0,0,0,.10) 0 2px,transparent 2px 7px),
    radial-gradient(2px 2px at 20% 30%,rgba(232,227,210,.18),transparent),
    radial-gradient(1.5px 1.5px at 70% 60%,rgba(232,227,210,.14),transparent),
    radial-gradient(1.5px 1.5px at 45% 85%,rgba(232,227,210,.12),transparent);
    animation:drift 26s linear infinite}
  .half--men::after{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;
    background:radial-gradient(130% 120% at 50% 122%,transparent 42%,rgba(0,0,0,.5) 100%)}
  @keyframes drift{from{transform:translate3d(0,0,0)}to{transform:translate3d(-4%,-3%,0)}}
  .half--men .mark{filter:drop-shadow(0 10px 24px rgba(0,0,0,.55))}
  .half--men .eyebrow{color:var(--m-yellow)}
  .half--men .dates{color:var(--m-dim)}
  .half--men .rule{background:var(--m-yellow);box-shadow:0 1px 0 rgba(0,0,0,.4)}
  .half--men .enter{border-color:var(--m-bone);color:var(--m-bone)}
  .half--men .enter:hover{background:var(--m-yellow);border-color:var(--m-yellow);color:var(--m-gun)}

  /* ---------- WOMEN signature ---------- */
  .half--women{color:var(--w-ink);background:
    radial-gradient(90% 70% at 70% 0%, rgba(181,152,79,.16), transparent 60%),
    linear-gradient(200deg,var(--w-pearl) 0%,var(--w-pearl-deep) 100%)}
  .half--women::before{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background-image:
    radial-gradient(2px 2px at 25% 40%,rgba(181,152,79,.5),transparent),
    radial-gradient(1.5px 1.5px at 65% 22%,rgba(181,152,79,.4),transparent),
    radial-gradient(2px 2px at 80% 70%,rgba(200,166,162,.5),transparent),
    radial-gradient(1.5px 1.5px at 40% 82%,rgba(181,152,79,.35),transparent);
    animation:motes 18s ease-in-out infinite alternate}
  @keyframes motes{from{transform:translateY(0);opacity:.7}to{transform:translateY(-16px);opacity:1}}
  .half--women .mark{filter:drop-shadow(0 12px 26px rgba(42,38,34,.14))}
  .half--women .eyebrow{color:var(--w-gold-deep)}
  .half--women .dates{color:var(--w-dim)}
  .half--women .rule{background:var(--w-gold)}
  .half--women .enter{border-color:var(--w-gold);color:var(--w-gold-deep)}
  .half--women .enter:hover{background:var(--w-gold);border-color:var(--w-gold);color:#fff;letter-spacing:.38em}

  /* ---------- SHARED LIGHT FRAME ---------- */
  .frame{position:absolute;left:0;right:0;z-index:6;color:var(--f-ink);
    background:linear-gradient(var(--f-bg),var(--f-bg2));
    display:flex;align-items:center;justify-content:center;text-align:center;opacity:0}
  .frame-top{top:0;height:clamp(46px,6.5vh,62px);border-bottom:1px solid var(--f-rule);
    box-shadow:0 1px 0 rgba(255,255,255,.4) inset;animation:fadeIn 1s ease 3s forwards}
  .frame-top .nm{font-family:var(--serif);font-weight:600;letter-spacing:.34em;
    font-size:clamp(.74rem,1.3vw,.98rem);text-transform:uppercase;
    display:inline-flex;align-items:center;gap:.8em}
  .frame-top .dot{width:5px;height:5px;background:var(--f-gold);transform:rotate(45deg);display:inline-block}
  .frame-bottom{bottom:0;flex-direction:column;padding:.85em 1em;border-top:1px solid var(--f-rule);
    animation:fadeIn 1s ease 3.2s forwards}
  .frame-bottom .vs{font-family:var(--serif);font-style:italic;
    font-size:clamp(.84rem,1.5vw,1.08rem);letter-spacing:.01em}
  .frame-bottom .ref{font-weight:700;letter-spacing:.34em;font-size:clamp(.56rem,.95vw,.68rem);
    text-transform:uppercase;margin-top:.5em;color:var(--f-gold)}

  /* ---------- INTRO ---------- */
  .intro{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;
    justify-content:center;text-align:center;background:radial-gradient(120% 100% at 50% 40%,#2c2a20,#13120d 82%);
    animation:introOut .9s ease 2.2s forwards}
  .intro h1{font-family:var(--serif);color:var(--m-bone);font-weight:600;letter-spacing:.34em;
    text-transform:uppercase;font-size:clamp(1.4rem,4.2vw,2.7rem);opacity:0;animation:up .9s ease .25s forwards}
  .intro .sub{color:var(--f-gold);font-style:italic;margin-top:1.1em;letter-spacing:.04em;
    font-family:var(--serif);font-size:clamp(.9rem,1.9vw,1.2rem);opacity:0;animation:up .9s ease .65s forwards}
  .intro .ln{width:0;height:1px;background:linear-gradient(90deg,transparent,var(--f-gold),transparent);
    margin:1.6em auto 0;animation:lnw 1s ease 1s forwards}
  @keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
  @keyframes lnw{to{width:min(260px,60vw)}}
  @keyframes introOut{to{opacity:0;visibility:hidden;transform:scale(1.06)}}

  /* ---------- ENTRANCE ---------- */
  .half--men .half__inner{animation:reveal .9s cubic-bezier(.22,.61,.36,1) 2.5s forwards}
  .half--women .half__inner{animation:reveal 1s cubic-bezier(.22,.61,.36,1) 2.7s forwards}
  @keyframes reveal{to{opacity:1;transform:translateY(0)}}
  .rule{animation:grow 1.3s ease 3.1s forwards}
  @keyframes grow{to{width:clamp(110px,15vw,190px)}}
  @keyframes fadeIn{to{opacity:1}}

  /* ---------- ENTER PREVIEW ---------- */
  .half.entering{flex-grow:6 !important;filter:none !important}
  .stage.has-entering .half:not(.entering){flex-grow:.001 !important;filter:saturate(.4) brightness(.6) !important}
  .toast{position:absolute;left:50%;bottom:15vh;z-index:40;transform:translate(-50%,20px);
    background:rgba(0,0,0,.84);color:#fff;padding:.8em 1.4em;border-radius:4px;font-size:.8rem;
    letter-spacing:.03em;opacity:0;pointer-events:none;transition:.4s;max-width:80vw}
  .toast.show{opacity:1;transform:translate(-50%,0)}

  /* ---------- MOBILE ---------- */
  .scrollhint{display:none;position:absolute;left:50%;bottom:calc(78px + 2vh);transform:translateX(-50%);
    z-index:7;flex-direction:column;align-items:center;gap:.4em;color:var(--m-bone);opacity:.85;
    font-size:.6rem;letter-spacing:.28em;text-transform:uppercase;animation:bob 1.8s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,6px)}}
  @media(max-width:760px){
    body{overflow-y:auto}
    .stage{flex-direction:column;height:auto}
    .half{min-height:92vh;min-height:92dvh}
    .stage:hover .half,.stage:hover .half:hover{flex-grow:1;filter:none}
    .mark{width:66%}
    .scrollhint{display:flex}
  }
  @media(prefers-reduced-motion:reduce){
    *{animation:none !important;transition:none !important}
    .half__inner{opacity:1;transform:none}.intro{display:none}
    .frame{opacity:1}.rule{width:clamp(110px,15vw,190px)}
  }
</style>

  <div class="intro" id="intro">
    <h1>NWKS&nbsp;Encounter</h1>
    <div class="sub">“It is for freedom that Christ has set us free.”</div>
    <div class="ln"></div>
  </div>

<script>
  (function(){
    var intro=document.getElementById('intro');
    if(intro){setTimeout(function(){intro.remove();},3400);}
    var stage=document.getElementById('stage');
    var toast=document.getElementById('toast');
    var reduce=window.matchMedia('(prefers-reduced-motion:reduce)').matches;
    var busy=false;
    document.querySelectorAll('.half').forEach(function(half){
      function go(e){
        if(e)e.stopPropagation();
        if(busy)return;busy=true;
        var label=half.getAttribute('data-world');
        if(reduce||window.matchMedia('(max-width:760px)').matches){flash(label);busy=false;return;}
        half.classList.add('entering');stage.classList.add('has-entering');flash(label);
        setTimeout(function(){half.classList.remove('entering');stage.classList.remove('has-entering');busy=false;},1300);
      }
      half.addEventListener('click',go);
      half.querySelector('.enter').addEventListener('click',go);
      half.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();go(e);}});
    });
    function flash(label){
      toast.textContent='Concept preview — this is where '+label+' world opens.';
      toast.classList.add('show');clearTimeout(flash._t);
      flash._t=setTimeout(function(){toast.classList.remove('show');},1900);
    }
  })();
</script>
