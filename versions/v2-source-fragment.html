<title>NWKS Encounter — Concept: Animated Gateway</title>
<style>
  :root{
    --m-olive:#3D4127; --m-olive-deep:#2A2D1B; --m-gun:#1B1D17;
    --m-bone:#E8E3D2; --m-bone-dim:#b3ae99; --m-yellow:#E6C12F;
    --w-pearl:#FAF6F1; --w-pearl-deep:#EFE7DC; --w-ink:#2A2622;
    --w-gold:#B5984F; --w-gold-deep:#8c722f; --w-rose:#C8A6A2;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:"Helvetica Neue",Arial,system-ui,sans-serif;background:#000;color:#fff;
    overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:relative;display:flex;width:100%;height:100vh;height:100dvh;overflow:hidden}

  .half{position:relative;flex:1 1 0;min-width:0;overflow:hidden;display:flex;flex-direction:column;
    align-items:center;justify-content:center;cursor:pointer;
    transition:flex-grow .7s cubic-bezier(.22,.61,.36,1),filter .7s ease}
  @media(hover:hover){
    .stage:hover .half{flex-grow:.82;filter:saturate(.85) brightness(.9)}
    .stage:hover .half:hover{flex-grow:1.55;filter:none}
  }
  .half__inner{position:relative;z-index:3;display:flex;flex-direction:column;align-items:center;
    text-align:center;padding:6vh 7vw;transform:translateY(16px);opacity:0;width:100%}
  .eyebrow{font-size:clamp(.6rem,1vw,.78rem);letter-spacing:.42em;text-transform:uppercase;font-weight:700}
  .dates{font-size:clamp(.78rem,1.3vw,1rem);letter-spacing:.14em;text-transform:uppercase}
  .enter{margin-top:3.2vh;display:inline-flex;align-items:center;gap:.7em;font-size:.72rem;
    letter-spacing:.34em;text-transform:uppercase;font-weight:700;padding:.95em 1.9em;border:1px solid;
    background:transparent;cursor:pointer;transition:all .35s ease}
  .enter .arr{transition:transform .35s ease}
  .enter:hover .arr{transform:translateX(6px)}

  /* ---------- MEN ---------- */
  .half--men{background:
      radial-gradient(120% 90% at 30% 8%, rgba(255,255,255,.07), transparent 55%),
      linear-gradient(155deg,var(--m-olive) 0%,var(--m-olive-deep) 58%,var(--m-gun) 100%);
    color:var(--m-bone)}
  .half--men::before{content:"";position:absolute;inset:-20%;z-index:1;opacity:.5;background-image:
      repeating-linear-gradient(115deg,rgba(0,0,0,.10) 0 2px,transparent 2px 7px),
      radial-gradient(2px 2px at 20% 30%,rgba(232,227,210,.18),transparent),
      radial-gradient(1.5px 1.5px at 70% 60%,rgba(232,227,210,.14),transparent),
      radial-gradient(1.5px 1.5px at 45% 85%,rgba(232,227,210,.12),transparent);
    animation:drift 26s linear infinite}
  .half--men::after{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;
    background:radial-gradient(130% 120% at 50% 122%,transparent 42%,rgba(0,0,0,.55) 100%)}
  @keyframes drift{from{transform:translate3d(0,0,0)}to{transform:translate3d(-4%,-3%,0)}}
  .men-emblem{width:clamp(72px,8vw,104px);filter:drop-shadow(0 6px 16px rgba(0,0,0,.55));
    margin-bottom:2.4vh}
  .men-word{width:min(80%,440px);max-width:78vw;filter:drop-shadow(0 8px 22px rgba(0,0,0,.5));
    margin-bottom:.4vh}
  .half--men .eyebrow{color:var(--m-yellow);margin-bottom:.3em}
  .half--men .dates{color:var(--m-bone-dim);margin-top:1.1em}
  .rule-m{width:0;height:3px;background:var(--m-yellow);margin:1.6vh auto 0;box-shadow:0 1px 0 rgba(0,0,0,.4)}
  .half--men .enter{border-color:var(--m-bone);color:var(--m-bone)}
  .half--men .enter:hover{background:var(--m-yellow);border-color:var(--m-yellow);color:var(--m-gun)}

  /* ---------- WOMEN ---------- */
  .half--women{background:
      radial-gradient(90% 70% at 70% 0%, rgba(181,152,79,.16), transparent 60%),
      linear-gradient(200deg,var(--w-pearl) 0%,var(--w-pearl-deep) 100%);
    color:var(--w-ink)}
  .half--women::before{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background-image:
      radial-gradient(2px 2px at 25% 40%,rgba(181,152,79,.5),transparent),
      radial-gradient(1.5px 1.5px at 65% 22%,rgba(181,152,79,.4),transparent),
      radial-gradient(2px 2px at 80% 70%,rgba(200,166,162,.5),transparent),
      radial-gradient(1.5px 1.5px at 40% 82%,rgba(181,152,79,.35),transparent);
    animation:motes 18s ease-in-out infinite alternate}
  .half--women::after{content:"";position:absolute;left:8%;top:14%;bottom:14%;width:1px;z-index:1;
    background:linear-gradient(transparent,rgba(181,152,79,.45),transparent)}
  @keyframes motes{from{transform:translateY(0);opacity:.7}to{transform:translateY(-16px);opacity:1}}
  .women-logo{width:clamp(210px,26vw,360px);max-width:74vw;
    filter:drop-shadow(0 12px 26px rgba(42,38,34,.14));animation:float 7s ease-in-out infinite}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
  .half--women .eyebrow{color:var(--w-gold-deep);margin-bottom:2vh}
  .half--women .dates{color:#8a8175;margin-top:1.4em}
  .rule-w{width:0;height:1px;background:var(--w-gold);margin:1.6vh auto 0}
  .half--women .enter{border-color:var(--w-gold);color:var(--w-gold-deep);border-radius:2px}
  .half--women .enter:hover{background:var(--w-gold);border-color:var(--w-gold);color:#fff;letter-spacing:.4em}

  /* ---------- SEAM + LEGIBLE OVERLAYS ---------- */
  .seam{position:absolute;left:50%;top:0;bottom:0;width:1px;z-index:5;transform:translateX(-50%);opacity:0;
    background:linear-gradient(transparent,rgba(230,193,47,0) 8%,rgba(230,193,47,.5) 35%,rgba(181,152,79,.5) 65%,rgba(181,152,79,0) 92%,transparent)}
  .plate{position:absolute;left:50%;z-index:6;transform:translateX(-50%);
    background:rgba(16,18,12,.72);-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px);
    border-top:1px solid rgba(230,193,47,.4);border-bottom:1px solid rgba(181,152,79,.4);
    padding:.7em 1.5em;text-align:center;white-space:nowrap;opacity:0}
  .topmark{top:0;border-top:none;border-radius:0 0 4px 4px;padding:.55em 1.4em}
  .topmark .nm{font-weight:800;letter-spacing:.46em;font-size:clamp(.6rem,1.1vw,.78rem);
    text-transform:uppercase;color:var(--m-bone)}
  .verse{bottom:0;border-bottom:none;border-radius:4px 4px 0 0;padding:.85em 1.7em;
    font-family:"Iowan Old Style",Palatino,Georgia,serif;font-style:italic;color:var(--m-bone);
    font-size:clamp(.8rem,1.4vw,1rem);letter-spacing:.02em}
  .verse b{display:block;font-style:normal;font-weight:700;letter-spacing:.34em;font-size:.6em;
    text-transform:uppercase;margin-top:.55em;color:var(--m-yellow);font-family:Arial,sans-serif}

  /* ---------- INTRO ---------- */
  .intro{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;
    justify-content:center;text-align:center;background:radial-gradient(120% 100% at 50% 40%,#33371f,#15170f 80%);
    animation:introOut .9s ease 2.2s forwards}
  .intro h1{color:var(--m-bone);font-weight:800;letter-spacing:.42em;text-transform:uppercase;
    font-size:clamp(1.3rem,4vw,2.6rem);opacity:0;animation:up .9s ease .25s forwards}
  .intro .sub{color:var(--m-yellow);font-style:italic;margin-top:1.1em;letter-spacing:.05em;
    font-family:Georgia,serif;font-size:clamp(.85rem,1.8vw,1.15rem);opacity:0;animation:up .9s ease .65s forwards}
  .intro .ln{width:0;height:1px;background:linear-gradient(90deg,transparent,var(--m-yellow),transparent);
    margin:1.6em auto 0;animation:lnw 1s ease 1s forwards}
  @keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
  @keyframes lnw{to{width:min(260px,60vw)}}
  @keyframes introOut{to{opacity:0;visibility:hidden;transform:scale(1.06)}}

  /* ---------- ENTRANCE TIMELINE ---------- */
  .half--men .half__inner{animation:reveal .9s cubic-bezier(.22,.61,.36,1) 2.5s forwards}
  .half--women .half__inner{animation:reveal 1s cubic-bezier(.22,.61,.36,1) 2.75s forwards}
  @keyframes reveal{to{opacity:1;transform:translateY(0)}}
  .rule-m{animation:growm 1.2s ease 3s forwards}
  @keyframes growm{to{width:clamp(90px,12vw,150px)}}
  .rule-w{animation:groww 1.4s ease 3.2s forwards}
  @keyframes groww{to{width:clamp(120px,16vw,210px)}}
  .seam{animation:seamIn 1.2s ease 2.6s forwards}@keyframes seamIn{to{opacity:1}}
  .verse{animation:fadeIn 1s ease 3.2s forwards}
  .topmark{animation:fadeIn 1s ease 3s forwards}
  @keyframes fadeIn{to{opacity:1}}

  /* ---------- ENTER PREVIEW ---------- */
  .half.entering{flex-grow:6 !important;filter:none !important}
  .stage.has-entering .half:not(.entering){flex-grow:.001 !important;filter:saturate(.4) brightness(.6) !important}
  .toast{position:absolute;left:50%;bottom:16vh;z-index:40;transform:translate(-50%,20px);
    background:rgba(0,0,0,.84);color:#fff;padding:.8em 1.4em;border-radius:4px;font-size:.8rem;
    letter-spacing:.03em;opacity:0;pointer-events:none;transition:.4s;max-width:80vw}
  .toast.show{opacity:1;transform:translate(-50%,0)}

  /* ---------- MOBILE ---------- */
  @media(max-width:760px){
    body{overflow-y:auto}
    .stage{flex-direction:column;height:auto}
    .half{min-height:90vh;min-height:90dvh}
    .stage:hover .half,.stage:hover .half:hover{flex-grow:1;filter:none}
    .men-word{width:84%}.women-logo{width:74%}
    .seam{left:0;right:0;top:auto;bottom:0;width:auto;height:1px;transform:none;
      background:linear-gradient(90deg,transparent,rgba(230,193,47,.5),rgba(181,152,79,.5),transparent)}
    .topmark{display:none}
    .verse{position:static;transform:none;width:100%;white-space:normal;border-radius:0;
      background:var(--m-gun);padding:1.5em 1.5em}
    .scrollhint{display:flex}
  }
  .scrollhint{display:none;position:absolute;left:50%;bottom:3vh;transform:translateX(-50%);z-index:7;
    flex-direction:column;align-items:center;gap:.4em;color:var(--m-bone);opacity:.8;font-size:.62rem;
    letter-spacing:.3em;text-transform:uppercase;animation:bob 1.8s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,6px)}}

  @media(prefers-reduced-motion:reduce){
    *{animation:none !important;transition:none !important}
    .half__inner{opacity:1;transform:none}.intro{display:none}
    .seam,.verse,.topmark{opacity:1}
    .rule-m{width:clamp(90px,12vw,150px)}.rule-w{width:clamp(120px,16vw,210px)}
  }
</style>

<div class="stage" id="stage">
  <div class="intro" id="intro">
    <h1>NWKS&nbsp;Encounter</h1>
    <div class="sub">“It is for freedom that Christ has set us free.”</div>
    <div class="ln"></div>
  </div>

  <section class="half half--men" data-world="the Men's Encounter" tabindex="0" aria-label="Enter Men's Encounter">
    <div class="half__inner">
      <img class="men-emblem" src="__MEN_BADGE_CUT__" alt="N.W. Kansas Freedom Encounter seal">
      <div class="eyebrow">Northwest Kansas&nbsp;·&nbsp;Men's</div>
      <img class="men-word" src="__MEN_WORD__" alt="Encounter">
      <div class="rule-m"></div>
      <div class="dates">August 6 – 8, 2026</div>
      <button class="enter" type="button">Enter <span class="arr">→</span></button>
    </div>
    <div class="scrollhint">Women's below<span>↓</span></div>
  </section>

  <section class="half half--women" data-world="the Women's Encounter" tabindex="0" aria-label="Enter Women's Encounter">
    <div class="half__inner">
      <div class="eyebrow">Northwest Kansas</div>
      <img class="women-logo" src="__WOMEN_CUT__" alt="NWKS Women's Encounter — Galatians 5:1">
      <div class="rule-w"></div>
      <div class="dates">July 17 – 19, 2026</div>
      <button class="enter" type="button">Enter <span class="arr">→</span></button>
    </div>
  </section>

  <div class="seam"></div>
  <div class="plate topmark"><span class="nm">NWKS&nbsp;Encounter</span></div>
  <div class="plate verse">“It is for freedom that Christ has set us free.”<b>Galatians 5:1</b></div>
  <div class="toast" id="toast"></div>
</div>

<script>
  (function(){
    var intro=document.getElementById('intro');
    if(intro){setTimeout(function(){intro.remove();},3400);}
    var stage=document.getElementById('stage');
    var toast=document.getElementById('toast');
    var reduce=window.matchMedia('(prefers-reduced-motion:reduce)').matches;
    var busy=false;
    document.querySelectorAll('.half').forEach(function(half){
      function go(e){
        if(e)e.stopPropagation();
        if(busy)return;busy=true;
        var label=half.getAttribute('data-world');
        if(reduce||window.matchMedia('(max-width:760px)').matches){flash(label);busy=false;return;}
        half.classList.add('entering');stage.classList.add('has-entering');flash(label);
        setTimeout(function(){half.classList.remove('entering');stage.classList.remove('has-entering');busy=false;},1300);
      }
      half.addEventListener('click',go);
      half.querySelector('.enter').addEventListener('click',go);
      half.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();go(e);}});
    });
    function flash(label){
      toast.textContent='Concept preview — this is where '+label+' world opens.';
      toast.classList.add('show');clearTimeout(flash._t);
      flash._t=setTimeout(function(){toast.classList.remove('show');},1900);
    }
  })();
</script>
