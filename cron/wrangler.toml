name = "nwks-encounter-cron"
main = "worker.ts"
compatibility_date = "2026-07-01"
compatibility_flags = ["nodejs_compat"]

# Cron Triggers — runs every minute.
# Cloudflare Pages does NOT support Cron Triggers, so scheduling uses this
# separate small Worker that binds the same D1/KV and env vars.
# Every minute so large "Send now" campaigns handed off to the background drain
# (sendDueCampaigns -> sendCampaignChunk) finish in minutes, not hours: each tick
# sends one bounded chunk per due campaign until the audience is fully drained.
[triggers]
crons = ["* * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "nwks-encounter"
database_id = "5bcd5ebb-cb1f-4a10-8fca-00c11fea5d9b"
migrations_dir = "../db/migrations"

[[kv_namespaces]]
binding = "SESSIONS"
id = "f35ff27e301240d6bfa59ca344520f3e"

[vars]
EMAIL_ENABLED  = "false"
EMAIL_FROM     = "NWKS Encounter <noreply@nwksencounter.com>"
EMAIL_REPLY_TO = ""
# Set RESEND_API_KEY as a secret: wrangler secret put RESEND_API_KEY
