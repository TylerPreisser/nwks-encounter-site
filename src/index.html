<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NWKS Encounter</title>
<meta name="description" content="Northwest Kansas Encounter — Men's Encounter (Aug 6–8, 2026) and Women's Encounter (July 17–19, 2026). It is for freedom that Christ has set us free. Galatians 5:1.">
<meta name="theme-color" content="#6E765F" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#3D4127" media="(prefers-color-scheme: dark)">
<link rel="stylesheet" href="styles/tokens.css">
<link rel="stylesheet" href="styles/fonts.css">
<link rel="stylesheet" href="styles/gateway.css">
<link rel="stylesheet" href="styles/worlds.css">
<link rel="stylesheet" href="styles/forms.css">
<link rel="stylesheet" href="styles/transitions.css">
<link rel="stylesheet" href="styles/transitions-men.css">
<link rel="stylesheet" href="styles/transitions-women.css">
<link rel="stylesheet" href="styles/page-transitions.css">
<script>(function(){var d=(new URLSearchParams(location.search)).get('door');if(d==='men'||d==='women')document.documentElement.setAttribute('data-world',d);})();</script>
</head>
<body>

<div class="stage" id="stage">
  <h1 class="visually-hidden">NWKS Encounter</h1>
  <section class="half half--men" data-door="men" aria-label="Men's Encounter">
    <div class="half__inner">
      <h2 class="eyebrow">Men's Encounter</h2>
      <img class="mark" src="../assets/men-logo-trim.jpg" alt="N.W. Kansas Freedom Encounter — Galatians 5:1">
      <div class="rule"></div>
      <div class="dates" data-nwks-date="mens">August 6 – 8, 2026</div>
      <button class="enter" type="button">Enter <span class="arr">→</span></button>
    </div>
  </section>

  <section class="half half--women" data-door="women" aria-label="Women's Encounter">
    <div class="half__inner">
      <h2 class="eyebrow">Women's Encounter</h2>
      <img class="mark" src="../assets/womens-mark-hd.webp" alt="NWKS Women's Encounter — Galatians 5:1">
      <div class="rule"></div>
      <div class="dates" data-nwks-date="women">July 17 – 19, 2026</div>
      <button class="enter" type="button">Enter <span class="arr">→</span></button>
    </div>
  </section>

  <!-- Visible concept switcher: lets the operator pick the active transition
       concept per door before hitting Enter. Options are built live at boot
       from NWKS.transitions (see app.js buildConceptSwitcher()) — nothing
       here is hardcoded to men-shatter/women-veil, so it grows automatically
       as more concept files register. Stays hidden if JS never populates it. -->
  <div class="concept-switcher" id="concept-switcher" data-hook="concept-switcher" hidden>
    <div class="concept-switcher__row">
      <label class="concept-switcher__label" for="concept-switcher-men">Men's FX</label>
      <select class="concept-switcher__select" id="concept-switcher-men" data-door="men"></select>
    </div>
    <div class="concept-switcher__row">
      <label class="concept-switcher__label" for="concept-switcher-women">Women's FX</label>
      <select class="concept-switcher__select" id="concept-switcher-women" data-door="women"></select>
    </div>
  </div>

  <div class="frame frame-top">
    <span class="nm">NWKS<span class="dot"></span>Encounter</span>
  </div>
  <div class="frame frame-bottom">
    <span class="vs">"It is for freedom that Christ has set us free. Stand firm, then, and do not let yourselves be burdened again by a yoke of slavery."</span>
    <span class="ref">Galatians 5:1</span>
  </div>

  <main id="world-men" class="world" hidden aria-label="Men's Encounter world"></main>
  <main id="world-women" class="world" hidden aria-label="Women's Encounter world"></main>
</div>

<!-- LOAD ORDER RULE (see src/js/transition-core.js for the full contract doc):
     registry.js (creates NWKS.transitions={}) -> content/worlds -> transition-core.js
     (defines NWKS.tx) -> transitions/*.js (any order/count — each self-registers
     into NWKS.transitions) -> app.js (must load LAST; calls NWKS.tx.run(...) and
     builds the concept switcher from whatever registered above). Adding a new
     concept = add one more script tag for js/transitions/your-file.js anywhere
     in the transitions/*.js block below. -->
<script src="js/config.js"></script>
<script src="js/date-sync.js"></script>
<script src="js/registry.js"></script>
<script src="content/men.js"></script>
<script src="content/women.js"></script>
<script src="content/forms.js"></script>
<script src="js/worlds.js"></script>
<script src="js/forms.js"></script>
<script src="js/transition-core.js"></script>
<!-- Kept: the two operator-approved concepts (rebuilt to premium, opaque masking).
     The 8 earlier concepts were rejected and are no longer loaded. -->
<script src="js/transitions/men-banner.js"></script>
<script src="js/transitions/women-banner.js"></script>
<script src="js/app.js"></script>

</body>
</html>
